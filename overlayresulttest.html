<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        * {
            box-sizing: border-box;
            text-transform: uppercase;
            margin: 0;
            padding: 0;
        }

        body {
            background: transparent;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            color: white;
        }
                #logo-container{
    position:absolute;
    top:20px;
    right:20px;
    z-index:9999;
}

#main-logo{
    height:130px;
    max-width:530px;
    object-fit:contain;
}

#single-wm{
    position:absolute;
    color:#ffffff;
    opacity:1.0;
    font-size:30px;
    font-weight:900;
    text-shadow:2px 2px 5px #000;
    white-space:nowrap;
    z-index:1;
    pointer-events:none;
}

        /* Weather Box Styling */
        #weather-box {
            position: absolute;
            bottom: 70px;
            left: 835px;
            width: 550px;
            height: 120px;
            display: none;
            overflow: hidden;
            background: transparent;
            border: none;
            z-index: 1001;
        }

        #weather-frame {
            width: 550px;
            height: 120px;
            border: none;
            pointer-events: none;
            transform: scale(1.5);
            transform-origin: top left;
            margin-top: -10px;
            margin-left: 5px;
        }

        /* Expiry Lock Screen */
        #expiry-lock {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .lock-msg {
            background: #FFD700;
            color: #000;
            padding: 20px 40px;
            border-radius: 15px;
            border: 4px solid white;
            box-shadow: 0 0 30px rgba(255,215,0,0.5);
        }

        .lock-msg h1 {
            font-size: 45px;
            font-weight: 950;
            margin-bottom: 10px;
        }

        .lock-msg h2 {
            font-size: 30px;
            font-weight: 800;
        }

        .lock-msg p {
            font-size: 22px;
            margin-top: 15px;
            font-weight: bold;
            border-top: 2px solid rgba(0,0,0,0.2);
            padding-top: 10px;
        }

        /* Summary Section */
        .summary-wrapper {
            position: absolute;
            bottom: 95px;
            right: 15px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .sum-card {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            min-width: 260px;
            height: 75px;
        }

        .sum-label-area {
            background: rgba(0,0,0,0.95);
            width: 65%;
            font-size: 22px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .sum-val-area {
            background: #fff;
            color: #000;
            width: 35%;
            font-size: 40px;
            font-weight: 950;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flash-text::after {
            content: attr(data-pa);
            animation: langFlash 8s infinite;
        }

        @keyframes langFlash {
            0%,45% {
                content: attr(data-pa);
            }

            50%,95% {
                content: attr(data-en);
            }
        }

        /* Winner Result */
        #result-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            width: 680px;
            height: 480px;
            background: rgba(15,17,19,0.98);
            border: 5px solid #f39c12;
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(243,156,18,0.5), inset 0 0 20px rgba(0,0,0,0.9);
            z-index: 3000;
            overflow: hidden;
            display: none;
            flex-direction: column;
        }

        #result-screen::before {
            content: "";
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,243,156,0.1) 50%, transparent);
            animation: slowGhaintLight 10s infinite ease-in-out;
            pointer-events: none;
            z-index: 3010;
        }

        .res-header {
            background: #f39c12;
            color: #000;
            text-align: center;
            padding: 15px 10px;
            font-size: 38px;
            font-weight: 1000;
            letter-spacing: 2px;
            border-bottom: 4px solid #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            z-index: 3005;
        }

        .res-scroll-window {
            flex: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
            background: #050505;
            padding: 20px 25px;
        }

        .res-list-area {
            position: absolute;
            width: calc(100% - 50px);
            will-change: transform;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: resultScroll 25s linear infinite;
        }

        @keyframes resultScroll {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-50%);
            }
        }

        .res-item {
            font-size: 36px;
            font-weight: 1000;
            color: #ffffff;
            letter-spacing: 1.5px;
            padding: 8px 10px;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Containers */
        .main-container {
            position: absolute;
            top: 10px;
            left: 20px;
            bottom: 85px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .box {
            display: none;
            flex: 1;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
            border-radius: 5px;
        }

        .box-header {
            height: 50px;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.2);
        }

        #box-fly .box-header {
            background: #0000FF;
        }

        #box-fly {
            background: rgba(0,0,100,0.8);
        }

        #box-time .box-header {
            background: #FFD700;
            color: black;
        }

        #box-time {
            background: rgba(180,150,0,0.8);
            color: black !important;
        }

        #box-out .box-header {
            background: #000000;
        }

        #box-out {
            background: rgba(0,0,0,0.8);
        }

        .header-title {
            font-size: 30px;
            font-weight: 950;
        }

        .count-tag {
            background: white;
            color: black;
            padding: 0 12px;
            border-radius: 4px;
            font-size: 30px;
            font-weight: 950;
            height: 32px;
            display: flex;
            align-items: center;
        }

        .scroll-window {
            position: absolute;
            top: 50px;
            bottom: 0;
            width: 100%;
            overflow: hidden;
        }

        .list-area {
            position: absolute;
            width: 100%;
            animation: constantScroll linear infinite;
            will-change: transform;
        }

        .item {
            padding: 8px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 40px;
            font-weight: 950;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
        }

        .item-num {
            color: #FFD700;
            min-width: 50px;
        }

        #box-time-val {
            font-size: 35px !important;
            font-weight: 950;
            margin-left: 10px;
        }

        #box-time .item,
        #box-time .item-num {
            color: black;
            text-shadow: none;
        }

        @keyframes constantScroll {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-50%);
            }
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: #000;
            display: flex;
            align-items: center;
            border-top: 6px solid #FFD700;
        }

        .live-tag {
            background: #FFD700;
            color: #000;
            padding: 0 40px;
            height: 100%;
            display: flex;
            align-items: center;
            font-size: 55px;
            font-weight: 950;
            font-style: italic;
            z-index: 2;
        }

        .ticker-wrap {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            color: #fff;
            font-weight: 950;
            font-size: 35px;
            display: flex;
            align-items: center;
            position: relative;
        }

        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker 65s linear infinite;
            will-change: transform;
        }

        @keyframes ticker {
            0% {
                transform: translate3d(0,0,0);
            }

            100% {
                transform: translate3d(-100%,0,0);
            }
        }

        .dt-box {
            background: #FFD700;
            height: 100%;
            padding: 0 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-left: 4px solid rgba(0,0,0,0.2);
            width: 300px;
            min-width: 300px;
            z-index: 2;
        }

        #dt-flash {
            font-size: 35px;
            font-weight: 950;
            color: #000;
            font-style: italic;
            text-align: center;
            width: 100%;
            font-variant-numeric: tabular-nums;
            display: inline-block;
        }
    </style>
</head>

<body>
 <!-- CLIENT LOGO -->
<div id="logo-container">
    <img id="main-logo" src="" alt="Logo">
</div>

<!-- WATERMARK -->
<div id="single-wm"></div> 

<div id="result-screen">
    <div class="res-header" id="res-title-text">FINAL RESULT</div>

    <div class="res-scroll-window">
        <div class="res-list-area" id="res-list-render"></div>
    </div>
</div>

<div id="weather-box">
    <iframe id="weather-frame" src=""></iframe>
</div>

<div id="expiry-lock">
    <div class="lock-msg">
        <h1>PLAN EXPIRED</h1>
        <h2>ਤੁਹਾਡਾ ਪਲਾਨ ਖ਼ਤਮ ਹੋ ਗਿਆ ਹੈ</h2>

        <p>
            RECHARGE ਲਈ ਸੰਪਰਕ ਕਰੋ:<br>
            MANPREET SINGH MUDKI<br>
            📞 86996-40061
        </p>
    </div>
</div>

<div class="summary-wrapper" id="summary-div">

    <div class="sum-card">
        <div class="sum-label-area flash-text" data-pa="ਕੁੱਲ ਕਬੂਤਰ" data-en="TOTAL PIGEONS"></div>
        <div id="m-total" class="sum-val-area">0</div>
    </div>

    <div class="sum-card">
        <div class="sum-label-area flash-text" style="border-left: 6px solid #0000FF;" data-pa="ਬਾਕੀ ਕਬੂਤਰ" data-en="REMAINING"></div>
        <div id="m-rem" class="sum-val-area">0</div>
    </div>

    <div class="sum-card">
        <div class="sum-label-area flash-text" style="border-left: 6px solid #FFD700;" data-pa="ਸਮੇਂ ਚ ਕਬੂਤਰ" data-en="TIME PIGEONS"></div>
        <div id="m-time" class="sum-val-area">0</div>
    </div>

</div>

<div class="main-container" id="scoreboard-div">

    <div id="box-fly" class="box">
        <div class="box-header">
            <span class="header-title flash-text" data-pa="🕊️ ਉੱਡ ਰਹੇ ਕਬੂਤਰ" data-en="🕊️ FLYING PIGEONS"></span>
            <span id="count-fly" class="count-tag">0</span>
        </div>

        <div class="scroll-window">
            <div class="list-area" id="list-fly"></div>
        </div>
    </div>

    <div id="box-time" class="box">
        <div class="box-header">
            <span class="header-title flash-text" data-pa="⏰ ਸਮੇਂ ਚ ਕਬੂਤਰ" data-en="⏰ TIME PIGEONS"></span>
            <span id="box-time-val"></span>
            <span id="count-time" class="count-tag">0</span>
        </div>

        <div class="scroll-window">
            <div class="list-area" id="list-time"></div>
        </div>
    </div>

    <div id="box-out" class="box">
        <div class="box-header">
            <span class="header-title flash-text" data-pa="❌ ਕੱਟੇ ਗਏ ਕਬੂਤਰ" data-en="❌ OUT PIGEONS"></span>
            <span id="count-out" class="count-tag">0</span>
        </div>

        <div class="scroll-window">
            <div class="list-area" id="list-out"></div>
        </div>
    </div>

</div>

<div class="footer" id="ticker-div">

    <div class="live-tag">LIVE</div>

    <div class="ticker-wrap">
        <div id="ticker-text" class="ticker-move">WELCOME</div>
    </div>

    <div class="dt-box">
        <div id="dt-flash">00:00:00 AM</div>
    </div>

</div>

<!-- RESULT + SCOREBOARD CONTROL -->

<script>

const firebaseConfig = {
    databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const urlParams = new URLSearchParams(window.location.search);

const userID = urlParams.get('id');
    
    const clientSettings = {

    "mudki1": {
        logo: "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/image-Photoroom%20(4).png",
        watermark: "M LIVE"
    },

    "ravijhandeana": {
        logo: "https://raw.githubusercontent.com/bhaimanpreetmudki/manpreetpigeons/arshpreet/Ravi%20Live%20Logo.png",
        watermark: "RAVI LIVE TV"
    },

    "kabutar2": {
        logo: "https://your-logo-link-2.png",
        watermark: "PIGEON TV"
    }

};

let showTime = true;
let previousAnimationTime = "";
let isResultActive = false;

function updateClock() {

    const now = new Date();

    const el = document.getElementById('dt-flash');

    if(!el) return;

    if(showTime) {

        el.innerText = now.toLocaleTimeString('en-US', {
            hour:'2-digit',
            minute:'2-digit',
            second:'2-digit',
            hour12:true
        }).toUpperCase();

    } else {

        el.innerText = now.toLocaleDateString('en-GB', {
            day:'2-digit',
            month:'short',
            year:'numeric'
        }).toUpperCase();
    }
}

setInterval(() => {
    if(showTime) updateClock();
}, 1000);

setInterval(() => {
    showTime = !showTime;
    updateClock();
}, 10000);

updateClock();

function triggerCutFlash(name) {
    console.log("CUT:", name);
}
    if(clientSettings[userID]){

    document.getElementById("main-logo").src =
        clientSettings[userID].logo;

    document.getElementById("single-wm").innerText =
        clientSettings[userID].watermark;
}

if(userID) {

    db.ref('users/' + userID).on('value', snap => {

        const data = snap.val();

        if(!data) return;

        const pigeons = data.pigeons || [];
        const conf = data.config || {};
        const resOver = data.resultOverlay || {};

        const footerElem = document.querySelector('.footer');

        if(conf.showTicker === false) {
            footerElem.style.display = "none";
        } else {
            footerElem.style.display = "flex";
        }

        const resScreen = document.getElementById('result-screen');
        const resArea = document.getElementById('res-list-render');
        const scoreboardElem = document.getElementById('scoreboard-div');
        const summaryElem = document.getElementById('summary-div');

        /* RESULT OVERLAY */

        if(resOver.active === true) {

            isResultActive = true;

            resScreen.style.display = "flex";

            /* HIDE SCOREBOARD + SUMMARY */
            scoreboardElem.style.display = "none";
            summaryElem.style.display = "none";

            document.getElementById('res-title-text').innerText =
                resOver.title || "FINAL RESULT";

            let detailsText = resOver.details || "";
            let linesArr = [];

            if(detailsText.trim() === "") {

                pigeons.forEach((p, idx) => {

                    if(p.name && p.status === 'fly') {

                        let originalNumber = idx + 1;

                        linesArr.push(`
                            <div class="res-item">
                                ${originalNumber}. ${p.name.toUpperCase()}
                            </div>
                        `);
                    }
                });

            } else {

                let rawLines = detailsText.split(/[\n,]+/);

                rawLines.forEach(line => {

                    if(line.trim() !== "") {

                        linesArr.push(`
                            <div class="res-item">
                                ${line.trim().toUpperCase()}
                            </div>
                        `);
                    }
                });
            }

            const finalHtmlContent = linesArr.join('');

            resArea.innerHTML = `
                <div class="res-block">${finalHtmlContent}</div>
                <div style="height:150px"></div>
                <div class="res-block">${finalHtmlContent}</div>
                <div style="height:150px"></div>
            `;

        } else {

            isResultActive = false;

            resScreen.style.display = "none";

            resArea.innerHTML = "";

            /* SHOW SCOREBOARD AGAIN */
            scoreboardElem.style.display =
                conf.showScoreboard ? "flex" : "none";

            summaryElem.style.display =
                conf.showScoreboard ? "flex" : "none";
        }

        /* WEATHER */

        const wBox = document.getElementById('weather-box');
        const wFrame = document.getElementById('weather-frame');

        if(conf.showWeather === true) {

            wBox.style.display = "block";

            let lat = conf.lat || "30.5980";
            let lon = conf.lon || "74.7380";
            let p_name = conf.pindName || "";

            const wUrl =
                `https://maxpunjab.com/weather/overlay.php?lat=${lat}&lon=${lon}&name=${encodeURIComponent(p_name)}`;

            if(wFrame.src !== wUrl) {
                wFrame.src = wUrl;
            }

        } else {

            wBox.style.display = "none";
        }

        /* CUT FLASH */

        if(data.cutAnimation && data.cutAnimation.time) {

            let currentAnimTime =
                String(data.cutAnimation.time);

            if(currentAnimTime !== previousAnimationTime) {

                previousAnimationTime = currentAnimTime;

                triggerCutFlash(data.cutAnimation.name);
            }
        }

        /* EXPIRY */

        const expiryTime = new Date(data.expiry).getTime();
        const currentTime = new Date().getTime();

        if(currentTime > expiryTime) {

            document.getElementById('expiry-lock').style.display = 'flex';

            return;

        } else {

            document.getElementById('expiry-lock').style.display = 'none';
        }

        /* TICKER */

        document.getElementById('ticker-div').style.display =
            conf.showTicker ? "flex" : "none";

        document.getElementById('ticker-text').innerText =
            conf.ticker || "";

        document.getElementById('box-time-val').innerText =
            conf.boxTime || "";

        /* COUNTS */

        let counts = {
            fly:0,
            out:0,
            time:0
        };

        let htmls = {
            fly:'',
            out:'',
            time:''
        };

        pigeons.forEach((p, idx) => {

            let row = `
                <div class="item">
                    <span class="item-num">${idx + 1}.</span>
                    <span>${p.name}</span>
                </div>
            `;

            if(p.status === 'fly') {

                counts.fly++;
                htmls.fly += row;

            } else if(p.status === 'time') {

                counts.time++;
                htmls.time += row;

            } else if(p.status === 'out') {

                counts.out++;
                htmls.out += row;
            }
        });

        document.getElementById('m-total').innerText =
            pigeons.length;

        document.getElementById('m-rem').innerText =
            pigeons.length - counts.out;

        document.getElementById('m-time').innerText =
            counts.time;

        /* BOXES */

        ['fly','time','out'].forEach(id => {

            const el = document.getElementById(`box-${id}`);

            const listArea =
                document.getElementById(`list-${id}`);

            if(counts[id] > 0) {

                el.style.display = "block";

                document.getElementById(`count-${id}`).innerText =
                    counts[id];

                let gap = '<div style="height:300px;"></div>';

                listArea.innerHTML =
                    htmls[id] + gap + htmls[id] + gap;

                let speedPixelsPerSecond = 45;

                let totalHeight =
                    listArea.scrollHeight / 2;

                listArea.style.animationDuration =
                    (totalHeight / speedPixelsPerSecond) + "s";

            } else {

                el.style.display = "none";
                
                const wmEl = document.getElementById("single-wm");

function moveWM(){

    wmEl.style.left =
        (Math.random() * 1400 + 100) + "px";

    wmEl.style.top =
        (Math.random() * 700 + 80) + "px";
}

moveWM();

setInterval(moveWM, 6000);
            }
        });
    });
}

</script>

</body>
</html>
