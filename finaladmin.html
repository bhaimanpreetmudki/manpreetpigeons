<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>ADMIN PANEL - MANPREET MUDKI</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f1113; color: white; padding: 10px; text-transform: uppercase; }
        .pigeon-row { background: #21262d; padding: 10px; margin-bottom: 5px; border-radius: 8px; display: flex; align-items: center; border: 1px solid #333; }
        .edit-name-box { background: transparent; border: 1px solid #444; color: #fff; padding: 5px; border-radius: 4px; width: 100%; margin: 0 10px; }
        .st-btn { border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; color: white; font-size: 10px; margin-left: 5px; opacity: 0.4; }
        .st-btn.active { opacity: 1; border: 1px solid white; }
    </style>
</head>
<body>

<div id="main-content">
    <textarea id="pName" placeholder="ਨਾਮ ਲਿਖੋ (ਕੌਮਾ ਪਾ ਕੇ)..."></textarea>
    <button onclick="addP()" style="width:100%; padding:10px; background:#f39c12;">ADD LIST</button>
    <div id="listArea" style="margin-top:20px;"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userID = new URLSearchParams(window.location.search).get('id');
    let localData = { pigeons: [] };

    // ਡਾਟਾ ਲੋਡ ਕਰੋ
    db.ref('users/' + userID).on('value', s => { 
        localData = s.val() || {pigeons:[]}; 
        render(); 
    });

    function render() {
        const listArea = document.getElementById('listArea');
        listArea.innerHTML = "";
        (localData.pigeons || []).forEach((p, idx) => {
            let row = document.createElement('div');
            row.className = 'pigeon-row';
            row.innerHTML = `
                <b>${idx + 1}.</b>
                <input type="text" class="edit-name-box" value="${p.name}" onblur="updateName('${p.id}', this.value)">
                <div>
                    <button class="st-btn ${p.status=='fly'?'active':''}" style="background:#3498db" onclick="setStatus('${p.id}','fly')">FLY</button>
                    <button class="st-btn ${p.status=='time'?'active':''}" style="background:#f1c40f" onclick="setStatus('${p.id}','time')">TIME</button>
                    <button class="st-btn ${p.status=='out'?'active':''}" style="background:#e74c3c" onclick="setStatus('${p.id}','out')">OUT</button>
                </div>
            `;
            listArea.appendChild(row);
        });
    }

    function setStatus(id, s) {
        let pIndex = localData.pigeons.findIndex(x => x.id === id);
        localData.pigeons[pIndex].status = s;
        
        // ਜੇ OUT ਹੈ ਤਾਂ Overlay ਲਈ ਡਾਟਾ ਭੇਜੋ
        if(s === 'out') {
            db.ref('users/' + userID + '/cutAnimation').set({
                name: localData.pigeons[pIndex].name,
                number: pIndex + 1,
                time: Date.now() // ਨਵਾਂ ਟਾਈਮ ਜੋ Overlay ਨੂੰ ਚਲਾਏਗਾ
            });
        }
        sync();
    }

    function updateName(id, name) {
        let p = localData.pigeons.find(p => p.id == id);
        p.name = name.toUpperCase();
        sync();
    }

    function addP() {
        let names = document.getElementById('pName').value.split(',').map(n => n.trim().toUpperCase());
        names.forEach(n => { if(n) localData.pigeons.push({id: "id_"+Date.now()+Math.random(), name: n, status: 'fly'}); });
        document.getElementById('pName').value = "";
        sync();
    }

    function sync() {
        db.ref('users/' + userID + '/pigeons').set(localData.pigeons);
    }
</script>
</body>
</html>
