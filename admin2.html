<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - Manpreet Mudki</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f1113; color: white; margin: 0; padding: 10px; }
        .top-mini-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1d21; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; font-size: 11px; }
        .top-mini-bar b { color: #f39c12; }
        .controls-container { background: #1a1d21; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
        textarea, input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #444; color: white; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box; margin-bottom: 10px; }
        .btn-add { background: #f39c12; color: black; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-update { background: #238636; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; }
        
        /* Result Controls */
        .result-controls { background: #1a1d21; padding: 15px; border-radius: 12px; border: 1px solid #f39c12; margin-bottom: 15px; }
        .res-btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn-declare { flex: 2; background: #f39c12; color: black; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; }
        .btn-pending { flex: 1; background: #ff4d4d; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; }
        .prize-input { background: #000; border: 2px solid #f39c12; color: #f39c12; font-weight: bold; text-align: center; font-size: 18px; margin-bottom: 5px; }

        .display-controls-box { background: #1a1d21; padding: 10px; border-radius: 10px; border: 1px solid #444; margin-bottom: 15px; }
        .btn-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .toggle-btn { flex: 1; min-width: 100px; padding: 10px; border: none; border-radius: 6px; font-weight: 900; font-size: 11px; cursor: pointer; color: white; }
        .btn-reset { width: 100%; padding: 10px; background: transparent; color: #ff4d4d; border: 1px solid #ff4d4d; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .admin-sum-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; background: #1a1d21; padding: 12px; border-radius: 12px; border: 1px solid #333; border-bottom: 3px solid #f39c12; }
        .sum-item { text-align: center; font-size: 10px; text-transform: uppercase; color: #aaa; }
        .sum-item b { font-size: 20px; color: #f39c12; display: block; }
        .pigeon-row { background: #21262d; padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; align-items: center; border: 1px solid #30363d; }
        .name-part { flex-grow: 1; display: flex; align-items: center; }
        .edit-name-box { background: transparent; border: 1px solid #444; color: #f39c12; padding: 5px; border-radius: 6px; font-size: 13px; font-weight: bold; width: 85%; margin-left: 5px; outline: none; }
        .btn-part { display: flex; gap: 4px; }
        .st-btn { border: none; padding: 7px; border-radius: 4px; font-weight: 900; width: 40px; color: white; opacity: 0.25; font-size: 10px; cursor: pointer; }
        .st-btn.active { opacity: 1; border: 1px solid white; }
        .login-box { max-width:350px; margin:80px auto; text-align:center; background:#1a1d21; padding:25px; border-radius:15px; border:1px solid #333; }
    </style>
</head>
<body>

<div id="login-box" class="login-box">
    <h2 style="color:#f39c12; font-size: 20px;">ADMIN LOGIN</h2>
    <input type="password" id="adminPass" placeholder="ਪਾਸਵਰਡ ਭਰੋ...">
    <button onclick="checkLogin()" class="btn-add">ENTER CONTROL</button>
</div>

<div id="main-content" style="display:none;">
    <div class="top-mini-bar">
        <span><i class="fas fa-phone-alt"></i> HELP: <b>+91 8699640061</b></span>
        <span><i class="fas fa-calendar-alt"></i> EXPIRY: <b id="expDisp">--</b></span>
    </div>

    <!-- Prize Control Section -->
    <div class="result-controls">
        <h3 style="font-size: 12px; color: #f39c12; margin-bottom: 10px;">🏆 RESULT CONTROL</h3>
        <label style="font-size: 10px; color: #aaa;">ਕਿੰਨੇ ਇਨਾਮ ਕੱਢਣੇ ਹਨ (ਜਿਵੇਂ 3 ਜਾਂ 4):</label>
        <input type="number" id="prizeLimit" class="prize-input" value="3">
        
        <div class="res-btn-row">
            <button class="btn-declare" onclick="declareResult('winners')">DECLARE WINNERS</button>
            <button class="btn-declare" style="background: #3498db; color: white;" onclick="declareResult('shared')">BAJI SHARED</button>
        </div>
        <div class="res-btn-row">
            <button class="btn-pending" onclick="clearResult()">❌ HIDE RESULT</button>
        </div>
    </div>

    <div class="controls-container">
        <textarea id="pName" placeholder="ਟੀਮਾਂ ਦੇ ਨਾਮ ਕੌਮਾ (,) ਪਾ ਕੇ ਲਿਖੋ..."></textarea>
        <button class="btn-add" onclick="addP()">ADD LIST</button>
        <input type="text" id="inpBoxTime" placeholder="ਟਾਈਮ ਬਾਕਸ">
        <input type="text" id="inpTicker" placeholder="ਟਿੱਕਰ ਮੈਸੇਜ...">
        <input type="text" id="inpPind" placeholder="ਪਿੰਡ ਦਾ ਨਾਮ">
        <button class="btn-update" onclick="manualUpdate()">UPDATE ALL DATA</button>
    </div>

    <div class="display-controls-box">
        <div class="btn-row">
            <button id="scoreBtn" onclick="toggleDisplay('showScoreboard')" class="toggle-btn">SHOW SCORE</button>
            <button id="tickerBtn" onclick="toggleDisplay('showTicker')" class="toggle-btn">SHOW TICKER</button>
        </div>
        <button class="btn-reset" onclick="resetData()">🔄 RESET FULL TOURNAMENT</button>
    </div>

    <div class="admin-sum-grid">
        <div class="sum-item">TOTAL<b id="sum-total">0</b></div>
        <div class="sum-item">FLY<b id="sum-fly" style="color:#3498db;">0</b></div>
        <div class="sum-item">TIME<b id="sum-time" style="color:#f1c40f;">0</b></div>
        <div class="sum-item">OUT<b id="sum-out" style="color:#e74c3c;">0</b></div>
    </div>

    <div id="listArea"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const urlParams = new URLSearchParams(window.location.search);
    const userID = urlParams.get('id');
    let localData = { pigeons: [], config: {} };

    function checkLogin() {
        if(!userID) { alert("ID MISSING!"); return; }
        db.ref('users/' + userID).once('value', snap => {
            const data = snap.val();
            if(data && data.password.toString() === document.getElementById('adminPass').value) {
                document.getElementById('login-box').style.display = "none";
                document.getElementById('main-content').style.display = "block";
                db.ref('users/' + userID).on('value', s => { 
                    if(s.val()) { localData = s.val(); render(); } 
                });
            } else { alert("ਗਲਤ ਪਾਸਵਰਡ!"); }
        });
    }

    // --- Winner Logic: Sort by Out Time (Last out = 1st) ---
    function declareResult(type) {
        let resultNames = [];
        let limit = parseInt(document.getElementById('prizeLimit').value) || 3;

        if(type === 'winners') {
            // ਸਿਰਫ 'OUT' ਜਾਂ 'TIME' ਵਾਲੇ ਕਬੂਤਰ ਲਓ ਅਤੇ ਉਹਨਾਂ ਨੂੰ OutTime ਮੁਤਾਬਕ ਉਲਟਾ ਸੋਰਟ ਕਰੋ
            const allOut = (localData.pigeons || [])
                .filter(p => p.status === 'out' || p.status === 'time')
                .sort((a, b) => (b.outTime || 0) - (a.outTime || 0));
            
            resultNames = allOut.slice(0, limit).map(p => p.name);
        } else {
            // ਸਾਂਝੀ ਬਾਜ਼ੀ ਲਈ ਉੱਡ ਰਹੇ (FLY) ਕਬੂਤਰ
            resultNames = (localData.pigeons || []).filter(p => p.status === 'fly').map(p => p.name);
        }

        if(resultNames.length === 0) { alert("ਕੋਈ ਟੀਮ ਲਿਸਟ ਵਿੱਚ ਨਹੀਂ ਹੈ!"); return; }

        db.ref('users/' + userID + '/resultOverlay').set({
            active: true,
            type: type,
            names: resultNames
        });
    }

    function setStatus(id, s) {
        const pIndex = localData.pigeons.findIndex(p => p.id === id);
        if(pIndex === -1) return;

        // ਜੇਕਰ OUT ਕੀਤਾ ਹੈ, ਤਾਂ ਮੌਜੂਦਾ ਟਾਈਮ ਸੇਵ ਕਰੋ
        if(s === 'out' && localData.pigeons[pIndex].status !== 'out') {
            localData.pigeons[pIndex].outTime = Date.now();
            db.ref('users/' + userID + '/cutAnimation').set({ name: localData.pigeons[pIndex].name, time: Date.now() });
        }
        
        localData.pigeons[pIndex].status = s;
        db.ref('users/' + userID + '/pigeons').set(localData.pigeons);
    }

    function render() {
        const list = document.getElementById('listArea');
        list.innerHTML = "";
        let c = { fly:0, time:0, out:0 };
        const pList = localData.pigeons || [];

        pList.forEach((p, idx) => {
            if(p.status === 'fly') c.fly++; else if(p.status === 'time') c.time++; else c.out++;
            list.innerHTML += `
                <div class="pigeon-row">
                    <div class="name-part"> 
                        <span style="font-size:12px; color:#666; margin-right:5px;">${idx+1}.</span>
                        <input type="text" class="edit-name-box" value="${p.name}" onblur="updateName('${p.id}', this.value)">
                    </div>
                    <div class="btn-part">
                        <button class="st-btn ${p.status=='fly'?'active':''}" style="background:#3498db" onclick="setStatus('${p.id}','fly')">FLY</button>
                        <button class="st-btn ${p.status=='time'?'active':''}" style="background:#f1c40f" onclick="setStatus('${p.id}','time')">TIME</button>
                        <button class="st-btn ${p.status=='out'?'active':''}" style="background:#e74c3c" onclick="setStatus('${p.id}','out')">OUT</button>
                        <button onclick="delP('${p.id}')" style="background:none; border:none; color:red; font-size:16px;">×</button>
                    </div>
                </div>`;
        });
        document.getElementById('sum-total').innerText = pList.length;
        document.getElementById('sum-fly').innerText = c.fly;
        document.getElementById('sum-time').innerText = c.time;
        document.getElementById('sum-out').innerText = c.out;
    }

    function addP() {
        const names = document.getElementById('pName').value.split(',').map(n => n.trim()).filter(n => n !== "");
        if(!localData.pigeons) localData.pigeons = [];
        names.forEach(n => localData.pigeons.push({ id: "id_" + Date.now() + Math.random(), name: n, status: 'fly', outTime: 0 }));
        document.getElementById('pName').value = ""; 
        db.ref('users/' + userID + '/pigeons').set(localData.pigeons);
    }

    function clearResult() { db.ref('users/' + userID + '/resultOverlay').set({ active: false }); }
    function updateName(id, newName) { localData.pigeons = localData.pigeons.map(p => p.id == id ? {...p, name: newName} : p); db.ref('users/' + userID + '/pigeons').set(localData.pigeons); }
    function delP(id) { if(confirm("Delete?")) { localData.pigeons = localData.pigeons.filter(p => p.id != id); db.ref('users/' + userID + '/pigeons').set(localData.pigeons); } }
    function toggleDisplay(field) { const cur = (localData.config && localData.config[field]) || false; db.ref('users/' + userID + '/config/' + field).set(!cur); }
    function resetData() { if(confirm("Reset Everything?")) { db.ref('users/' + userID + '/pigeons').set([]); clearResult(); } }
    function manualUpdate() { db.ref('users/' + userID + '/config').update({ ticker: document.getElementById('inpTicker').value, boxTime: document.getElementById('inpBoxTime').value, pindName: document.getElementById('inpPind').value }); }
</script>
</body>
</html>
