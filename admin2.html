<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - Manpreet Mudki</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f1113; color: white; margin: 0; padding: 10px; text-transform: uppercase; }
        .top-mini-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1d21; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; font-size: 11px; }
        .controls-container { background: #1a1d21; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
        textarea, input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #444; color: white; border-radius: 8px; font-size: 14px; margin-bottom: 10px; box-sizing: border-box; }
        .btn-add { background: #f39c12; color: black; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-update { background: #238636; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; }
        .section-title { font-size: 14px; font-weight: 900; margin: 10px 0; padding-left: 5px; border-left: 4px solid #f39c12; }
        .pigeon-row { background: #21262d; padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; align-items: center; border: 1px solid #30363d; }
        .edit-name-box { background: transparent; border: 1px solid #444; color: #f39c12; padding: 5px; border-radius: 6px; width: 60%; margin-left: 5px; }
        .st-btn { border: none; padding: 8px; border-radius: 5px; color: white; opacity: 0.3; cursor: pointer; font-size: 10px; }
        .st-btn.active { opacity: 1; border: 1px solid white; }
        .login-box { max-width:350px; margin:80px auto; text-align:center; background:#1a1d21; padding:25px; border-radius:15px; border:1px solid #333; }
        .pos-input { width: 40px; background: #0d1117; border: 1px solid #444; color: #f39c12; text-align: center; border-radius: 4px; padding: 4px; }
    </style>
</head>
<body>

<div id="login-box" class="login-box">
    <h2 style="color:#f39c12;">ADMIN LOGIN</h2>
    <input type="password" id="adminPass" placeholder="ਪਾਸਵਰਡ ਭਰੋ...">
    <button onclick="checkLogin()" class="btn-add">ENTER CONTROL</button>
</div>

<div id="main-content" style="display:none;">
    <div class="controls-container">
        <textarea id="pName" placeholder="ਟੀਮਾਂ ਦੇ ਨਾਮ ਕੌਮਾ (,) ਪਾ ਕੇ ਲਿਖੋ..."></textarea>
        <button class="btn-add" onclick="addP()">ADD LIST</button>
        <input type="text" id="inpBoxTime" placeholder="ਟਾਈਮ ਬਾਕਸ">
        <input type="text" id="inpPind" placeholder="ਪਿੰਡ ਦਾ ਨਾਮ">
        <button class="btn-update" onclick="manualUpdate()">UPDATE ALL DATA</button>
    </div>

    <div class="controls-container">
        <div class="section-title">TICKER SETUP</div>
        <input type="text" id="row1" placeholder="ROW 1 (TOP)">
        <input type="text" id="row2" placeholder="ROW 2 (MIDDLE)">
        <input type="text" id="row3" placeholder="ROW 3 (BOTTOM)">
        <button class="btn-update" onclick="updateTickerRows()">SAVE TICKER ROWS</button>
    </div>

    <div id="listArea"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com//" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userID = new URLSearchParams(window.location.search).get('id');

    function checkLogin() {
        db.ref('users/' + userID).once('value', snap => {
            const data = snap.val();
            if(data && data.password.toString() === document.getElementById('adminPass').value) {
                document.getElementById('login-box').style.display = "none";
                document.getElementById('main-content').style.display = "block";
                db.ref('users/' + userID).on('value', s => { if(s.val()) render(s.val()); });
            } else { alert("ਗਲਤ ਪਾਸਵਰਡ!"); }
        });
    }

    function render(data) {
        const pList = data.pigeons || [];
        const listArea = document.getElementById('listArea');
        listArea.innerHTML = "";
        pList.forEach((p, idx) => {
            listArea.innerHTML += `
                <div class="pigeon-row">
                    <input type="number" class="pos-input" value="${idx+1}" onchange="movePosition('${p.id}', this.value)">
                    <input type="text" class="edit-name-box" value="${p.name}" onblur="updateName('${p.id}', this.value)">
                    <button class="st-btn ${p.status=='fly'?'active':''}" style="background:#3498db" onclick="setStatus('${p.id}','fly')">FLY</button>
                    <button class="st-btn ${p.status=='time'?'active':''}" style="background:#f1c40f" onclick="setStatus('${p.id}','time')">TIME</button>
                    <button style="background:none; border:none; color:red; cursor:pointer;" onclick="delP('${p.id}')">×</button>
                </div>`;
        });
        document.getElementById('inpBoxTime').value = data.config?.boxTime || "";
        document.getElementById('inpPind').value = data.config?.pindName || "";
        document.getElementById('row1').value = data.tickerRows?.row1 || "";
        document.getElementById('row2').value = data.tickerRows?.row2 || "";
        document.getElementById('row3').value = data.tickerRows?.row3 || "";
    }

    function manualUpdate() {
        db.ref('users/' + userID + '/config').update({
            boxTime: document.getElementById('inpBoxTime').value,
            pindName: document.getElementById('inpPind').value
        }).then(() => alert("DATA UPDATED!"));
    }

    function updateTickerRows() {
        db.ref('users/' + userID + '/tickerRows').update({
            row1: document.getElementById('row1').value,
            row2: document.getElementById('row2').value,
            row3: document.getElementById('row3').value
        }).then(() => alert("TICKER SAVED!"));
    }

    function addP() {
        const names = document.getElementById('pName').value.split(',').map(n => n.trim().toUpperCase()).filter(n => n !== "");
        db.ref('users/' + userID + '/pigeons').once('value', snap => {
            let list = snap.val() || [];
            names.forEach(n => list.push({ id: "id_" + Date.now() + Math.random(), name: n, status: 'fly' }));
            db.ref('users/' + userID + '/pigeons').set(list);
            document.getElementById('pName').value = "";
        });
    }

    function setStatus(id, s) {
        db.ref('users/' + userID + '/pigeons').once('value', snap => {
            let list = snap.val();
            list = list.map(p => p.id == id ? {...p, status: s} : p);
            db.ref('users/' + userID + '/pigeons').set(list);
        });
    }

    function updateName(id, val) {
        db.ref('users/' + userID + '/pigeons').once('value', snap => {
            let list = snap.val();
            list = list.map(p => p.id == id ? {...p, name: val.toUpperCase()} : p);
            db.ref('users/' + userID + '/pigeons').set(list);
        });
    }

    function delP(id) {
        db.ref('users/' + userID + '/pigeons').once('value', snap => {
            let list = snap.val().filter(p => p.id != id);
            db.ref('users/' + userID + '/pigeons').set(list);
        });
    }

    function movePosition(id, newPos) {
        db.ref('users/' + userID + '/pigeons').once('value', snap => {
            let list = snap.val();
            const oldIndex = list.findIndex(p => p.id === id);
            const [item] = list.splice(oldIndex, 1);
            list.splice(newPos - 1, 0, item);
            db.ref('users/' + userID + '/pigeons').set(list);
        });
    }
</script>
</body>
</html>
