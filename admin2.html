<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manpreet Singh Mudki - Advanced Pigeon Admin</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f1113; color: white; margin: 0; padding: 10px; }
        .top-mini-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1d21; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; font-size: 11px; }
        .top-mini-bar b { color: #f39c12; }
        
        /* Input Sections */
        .controls-container { background: #1a1d21; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
        textarea, input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #444; color: white; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box; margin-bottom: 10px; }
        
        /* Buttons */
        .btn-add { background: #f39c12; color: black; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; margin-bottom: 10px; text-transform: uppercase; }
        .btn-update { background: #238636; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; }
        
        /* Result Box Style */
        .result-box-ui { background: #1c2128; border: 2px solid #3498db; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .result-title { font-size: 14px; color: #3498db; font-weight: bold; margin-bottom: 10px; display: block; text-align: center; }

        /* Status Grid */
        .admin-sum-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; background: #1a1d21; padding: 12px; border-radius: 12px; border: 1px solid #333; border-bottom: 3px solid #f39c12; }
        .sum-item { text-align: center; font-size: 10px; text-transform: uppercase; color: #aaa; }
        .sum-item b { font-size: 20px; color: #f39c12; display: block; }

        /* Pigeon Rows */
        .pigeon-row { background: #21262d; padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; align-items: center; border: 1px solid #30363d; }
        .name-part { flex-grow: 1; display: flex; align-items: center; }
        .pos-input { width: 35px; background: #0d1117; border: 1px solid #444; color: #f39c12; font-size: 12px; text-align: center; border-radius: 4px; padding: 4px; margin-right: 8px; }
        .edit-name-box { background: transparent; border: none; color: white; font-size: 14px; font-weight: bold; width: 100%; outline: none; text-transform: uppercase; }
        
        .st-btn { border: none; padding: 8px; border-radius: 4px; font-weight: 900; width: 45px; color: white; opacity: 0.3; font-size: 10px; cursor: pointer; margin-left: 4px; }
        .st-btn.active { opacity: 1; border: 1px solid white; box-shadow: 0 0 5px rgba(255,255,255,0.2); }
        
        .login-box { max-width:350px; margin:80px auto; text-align:center; background:#1a1d21; padding:25px; border-radius:15px; border:1px solid #333; }
        .display-controls-box { background: #1a1d21; padding: 10px; border-radius: 10px; border: 1px solid #444; margin-bottom: 15px; }
        .btn-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .toggle-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 900; font-size: 11px; cursor: pointer; color: white; }
    </style>
</head>
<body>

<div id="login-box" class="login-box">
    <h2 style="color:#f39c12;">ADMIN LOGIN</h2>
    <input type="password" id="adminPass" placeholder="ਪਾਸਵਰਡ ਭਰੋ...">
    <button onclick="checkLogin()" class="btn-add">ENTER CONTROL</button>
</div>

<div id="main-content" style="display:none;">
    <div class="top-mini-bar">
        <span><i class="fas fa-user"></i> <b>MANPREET MUDKI</b></span>
        <span><i class="fas fa-calendar-alt"></i> <b id="expDisp">--</b></span>
    </div>

    <!-- RESULT & SHARED BOX (NEW) -->
    <div class="result-box-ui">
        <span class="result-title"><i class="fas fa-trophy"></i> RESULT & SHARED CONTROL</span>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
            <input type="number" id="winCount" placeholder="ਇਨਾਮਾਂ ਦੀ ਗਿਣਤੀ (1-10)" style="margin-bottom:0; flex: 2; border: 1px solid #3498db;">
            <button onclick="setResult('winners')" class="btn-update" style="flex: 1.5; background: #3498db; font-size: 11px;">SHOW WINNERS</button>
        </div>
        <div style="display: flex; gap: 8px;">
            <button onclick="setResult('shared')" class="btn-add" style="margin-bottom:0; flex: 1; background: #8e44ad; color: white;">BAJI SHARED (FLY)</button>
            <button onclick="clearResult()" class="btn-update" style="flex: 1; background: #444; font-size: 11px;">CLOSE BOX</button>
        </div>
    </div>

    <!-- CONFIG CONTROLS -->
    <div class="controls-container">
        <textarea id="pName" placeholder="ਟੀਮਾਂ ਦੇ ਨਾਮ ਲਿਖੋ (ਕੌਮਾ ਲਗਾ ਕੇ)..."></textarea>
        <button class="btn-add" onclick="addP()">ADD TEAM LIST</button>
        <input type="text" id="inpTicker" placeholder="ਟਿੱਕਰ ਮੈਸੇਜ (Scroll Message)...">
        <button class="btn-update" onclick="manualUpdate()">UPDATE OVERLAY INFO</button>
    </div>

    <div class="display-controls-box">
        <div class="btn-row">
            <button id="scoreBtn" onclick="toggleDisplay('showScoreboard')" class="toggle-btn">SCOREBOARD</button>
            <button id="tickerBtn" onclick="toggleDisplay('showTicker')" class="toggle-btn">TICKER</button>
        </div>
    </div>

    <!-- SUMMARY STATS -->
    <div class="admin-sum-grid">
        <div class="sum-item">TOTAL<b id="sum-total">0</b></div>
        <div class="sum-item">FLYING<b id="sum-fly" style="color:#3498db;">0</b></div>
        <div class="sum-item">TIME<b id="sum-time" style="color:#f1c40f;">0</b></div>
        <div class="sum-item">OUT<b id="sum-out" style="color:#e74c3c;">0</b></div>
    </div>

    <div id="listArea"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const urlParams = new URLSearchParams(window.location.search);
    const userID = urlParams.get('id');
    let localData = { pigeons: [], config: {} };

    function checkLogin() {
        if(!userID) return alert("Error: No ID");
        db.ref('users/' + userID).once('value', snap => {
            const data = snap.val();
            if(data && data.password.toString() === document.getElementById('adminPass').value) {
                document.getElementById('login-box').style.display = "none";
                document.getElementById('main-content').style.display = "block";
                document.getElementById('expDisp').innerText = data.expiry || "LIVE";
                db.ref('users/' + userID).on('value', s => { if(s.val()) { localData = s.val(); render(); } });
            } else { alert("Wrong Password!"); }
        });
    }

    function render() {
        const conf = localData.config || {};
        document.getElementById('scoreBtn').style.backgroundColor = conf.showScoreboard ? "#238636" : "#dc3545";
        document.getElementById('tickerBtn').style.backgroundColor = conf.showTicker ? "#238636" : "#dc3545";
        
        const list = document.getElementById('listArea');
        list.innerHTML = "";
        let c = { fly:0, time:0, out:0 };
        const pList = localData.pigeons || [];

        pList.forEach((p, idx) => {
            if(p.status === 'fly') c.fly++; else if(p.status === 'time') c.time++; else c.out++;
            list.innerHTML += `
                <div class="pigeon-row">
                    <div class="name-part"> 
                        <input type="number" class="pos-input" value="${idx+1}" onchange="movePos('${p.id}', this.value)">
                        <input type="text" class="edit-name-box" value="${p.name}" onblur="updateName('${p.id}', this.value)">
                    </div>
                    <div class="btn-part">
                        <button class="st-btn ${p.status=='fly'?'active':''}" style="background:#3498db" onclick="setStatus('${p.id}','fly')">FLY</button>
                        <button class="st-btn ${p.status=='time'?'active':''}" style="background:#f1c40f" onclick="setStatus('${p.id}','time')">TIME</button>
                        <button class="st-btn ${p.status=='out'?'active':''}" style="background:#e74c3c" onclick="setStatus('${p.id}','out')">OUT</button>
                    </div>
                </div>`;
        });
        document.getElementById('sum-total').innerText = pList.length;
        document.getElementById('sum-fly').innerText = c.fly;
        document.getElementById('sum-time').innerText = c.time;
        document.getElementById('sum-out').innerText = c.out;
    }

    // --- RESULT LOGIC ---
    function setResult(type) {
        let resData = { active: true, type: type, names: [] };
        if (type === 'winners') {
            let n = parseInt(document.getElementById('winCount').value);
            if (!n) return alert("ਕਿੰਨੇ ਇਨਾਮ ਦਿਖਾਉਣੇ ਹਨ?");
            resData.names = localData.pigeons.slice(0, n).map(p => p.name.toUpperCase());
        } else {
            resData.names = localData.pigeons.filter(p => p.status === 'fly').map(p => p.name.toUpperCase());
        }
        db.ref('users/' + userID + '/resultDisplay').set(resData);
        db.ref('users/' + userID + '/config/showScoreboard').set(false); // Hide main list
    }

    function clearResult() {
        db.ref('users/' + userID + '/resultDisplay/active').set(false);
        db.ref('users/' + userID + '/config/showScoreboard').set(true);
    }

    // --- PIGEON MANAGEMENT ---
    function setStatus(id, s) {
        const p = localData.pigeons.find(x => x.id === id);
        // Animation signal if someone gets OUT
        if (p && p.status === 'fly' && s === 'out') {
            db.ref('users/' + userID + '/animation').set({ name: p.name, type: 'OUT', ts: Date.now() });
        }
        localData.pigeons = localData.pigeons.map(p => p.id == id ? {...p, status: s} : p);
        db.ref('users/' + userID + '/pigeons').set(localData.pigeons);
    }

    function movePos(id, newPos) {
        let pList = [...localData.pigeons];
        let index = pList.findIndex(p => p.id === id);
        let [item] = pList.splice(index, 1);
        pList.splice(newPos - 1, 0, item);
        db.ref('users/' + userID + '/pigeons').set(pList);
    }

    function addP() {
        const raw = document.getElementById('pName').value;
        const names = raw.split(',').map(n => n.trim().toUpperCase()).filter(n => n !== "");
        let current = localData.pigeons || [];
        names.forEach(n => current.push({ id: "id_"+Date.now()+Math.random(), name: n, status: 'fly' }));
        db.ref('users/' + userID + '/pigeons').set(current);
        document.getElementById('pName').value = "";
    }

    function updateName(id, val) {
        localData.pigeons = localData.pigeons.map(p => p.id == id ? {...p, name: val.toUpperCase()} : p);
        db.ref('users/' + userID + '/pigeons').set(localData.pigeons);
    }

    function manualUpdate() {
        db.ref('users/' + userID + '/config').update({
            ticker: document.getElementById('inpTicker').value.toUpperCase()
        });
    }

    function toggleDisplay(key) {
        db.ref('users/' + userID + '/config/' + key).set(!localData.config[key]);
    }
</script>
</body>
</html>
