<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - Manpreet Mudki</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f1113; color: white; margin: 0; padding: 10px; }
        .top-mini-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1d21; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; font-size: 11px; }
        .top-mini-bar b { color: #f39c12; }
        .controls-container { background: #1a1d21; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
        textarea, input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #444; color: white; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box; margin-bottom: 10px; }
        
        /* Result Section */
        .result-controls { background: #1a1d21; padding: 15px; border-radius: 12px; border: 1px solid #f39c12; margin-bottom: 15px; }
        .res-btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn-declare { flex: 1; background: #f39c12; color: black; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 14px; }
        .btn-pending { width: 100%; background: #444; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }

        .btn-add { background: #f39c12; color: black; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-update { background: #238636; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; }
        .display-controls-box { background: #1a1d21; padding: 10px; border-radius: 10px; border: 1px solid #444; margin-bottom: 15px; }
        .btn-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .toggle-btn { flex: 1; min-width: 100px; padding: 10px; border: none; border-radius: 6px; font-weight: 900; font-size: 11px; cursor: pointer; color: white; }
        
        .admin-sum-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; background: #1a1d21; padding: 12px; border-radius: 12px; border: 1px solid #333; border-bottom: 3px solid #f39c12; }
        .sum-item { text-align: center; font-size: 10px; text-transform: uppercase; color: #aaa; }
        .sum-item b { font-size: 20px; color: #f39c12; display: block; }
        
        .pigeon-row { background: #21262d; padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; align-items: center; border: 1px solid #30363d; }
        .name-part { flex-grow: 1; display: flex; align-items: center; gap: 8px; }
        .pos-input { width: 45px; background: #000; border: 1px solid #f39c12; color: #f39c12; text-align: center; border-radius: 5px; padding: 5px; font-weight: bold; }
        .edit-name-box { background: transparent; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 6px; font-size: 14px; width: 100%; outline: none; }
        
        .btn-part { display: flex; gap: 5px; }
        .st-btn { border: none; padding: 10px 12px; border-radius: 6px; font-weight: 900; color: white; opacity: 0.3; font-size: 11px; cursor: pointer; }
        .st-btn.active { opacity: 1; outline: 2px solid white; }
        .login-box { max-width:350px; margin:80px auto; text-align:center; background:#1a1d21; padding:25px; border-radius:15px; border:1px solid #333; }
    </style>
</head>
<body>

<div id="login-box" class="login-box">
    <h2 style="color:#f39c12;">ADMIN LOGIN</h2>
    <input type="password" id="adminPass" placeholder="Password">
    <button onclick="checkLogin()" class="btn-add">ENTER CONTROL</button>
</div>

<div id="main-content" style="display:none;">
    <div class="top-mini-bar">
        <span>HELP: <b>+91 8699640061</b></span>
        <span>EXPIRY: <b id="expDisp">--</b></span>
    </div>

    <!-- Result Control -->
    <div class="result-controls">
        <h3 style="font-size: 12px; color: #f39c12; margin-bottom: 8px;">🏆 RESULT CONTROL</h3>
        <input type="number" id="prizeLimit" placeholder="Prizes (e.g. 3)" value="3" style="text-align: center; border-color: #f39c12;">
        <div class="res-btn-row">
            <button class="btn-declare" onclick="declareResult('auto')">AUTO WINNERS</button>
            <button class="btn-declare" style="background: #3498db; color: white;" onclick="declareResult('shared')">BAJI SHARED</button>
        </div>
        <button class="btn-pending" onclick="clearResult()">HIDE RESULT INFO</button>
    </div>

    <div class="controls-container">
        <textarea id="pName" placeholder="Enter Team Names (Comma Separated)"></textarea>
        <button class="btn-add" onclick="addP()">ADD TEAMS</button>
        <input type="text" id="inpBoxTime" placeholder="Box Time Text">
        <input type="text" id="inpTicker" placeholder="Ticker Message">
        <div style="display: flex; gap: 5px;">
            <input type="text" id="inpPind" placeholder="Village Name (Weather)" style="margin-bottom:0;">
            <button onclick="findLocation()" style="width: 50px; background: #3498db; border: none; border-radius: 8px; color: white; cursor: pointer;">
                <i class="fas fa-search"></i>
            </button>
        </div>
        <input type="hidden" id="inpLat"><input type="hidden" id="inpLon">
        <button class="btn-update" style="margin-top:10px;" onclick="manualUpdate()">UPDATE SETTINGS</button>
    </div>

    <div class="display-controls-box">
        <div class="btn-row">
            <button id="scoreBtn" onclick="toggleDisplay('showScoreboard')" class="toggle-btn">SCOREBOARD</button>
            <button id="tickerBtn" onclick="toggleDisplay('showTicker')" class="toggle-btn">TICKER</button>
            <button id="weatherBtn" onclick="toggleDisplay('showWeather')" class="toggle-btn">WEATHER</button>
        </div>
        <button onclick="resetData()" style="width:100%; padding:10px; background:none; border:1px solid red; color:red; border-radius:8px; cursor:pointer;">RESET ALL</button>
    </div>

    <div class="admin-sum-grid">
        <div class="sum-item">TOTAL<b id="sum-total">0</b></div>
        <div class="sum-item">FLY<b id="sum-fly" style="color:#3498db;">0</b></div>
        <div class="sum-item">TIME<b id="sum-time" style="color:#f1c40f;">0</b></div>
        <div class="sum-item">OUT<b id="sum-out" style="color:#e74c3c;">0</b></div>
    </div>

    <div id="listArea"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userID = new URLSearchParams(window.location.search).get('id');
    let localData = { pigeons: [], config: {} };

    function checkLogin() {
        db.ref('users/' + userID).once('value', snap => {
            const data = snap.val();
            if(data && data.password.toString() === document.getElementById('adminPass').value) {
                document.getElementById('login-box').style.display = "none";
                document.getElementById('main-content').style.display = "block";
                document.getElementById('expDisp').innerText = data.expiry || "2026";
                db.ref('users/' + userID).on('value', s => { if(s.val()) { localData = s.val(); render(); } });
            } else { alert("Wrong Password!"); }
        });
    }

    // --- Winner Logic ---
  function declareResult(mode) {
        let winners = [];
        let limit = parseInt(document.getElementById('prizeLimit').value) || 3;
        let pigeons = [...(localData.pigeons || [])];
        let sharedFlag = false; // ਨਵਾਂ ਵੇਰੀਏਬਲ

        if(mode === 'auto') {
            // AUTO WINNERS ਲਈ ਲੋਜਿਕ
            let flying = pigeons.filter(p => p.status === 'fly');
            let outList = pigeons.filter(p => p.status === 'out' || p.status === 'time')
                                 .sort((a,b) => (b.outTime || 0) - (a.outTime || 0));
            
            winners = [...flying, ...outList].slice(0, limit).map(p => p.name);
            sharedFlag = false; // ਨੋਰਮਲ ਰਿਜ਼ਲਟ
        } else {
            // BAJI SHARED ਲਈ ਲੋਜਿਕ
            winners = pigeons.filter(p => p.status === 'fly').map(p => p.name);
            sharedFlag = true; // ਇਹ ਬਾਜੀ ਸਾਂਝੀ ਹੈ
        }

        // ਡੇਟਾਬੇਸ ਵਿੱਚ isShared ਭੇਜਣਾ ਜ਼ਰੂਰੀ ਹੈ
        db.ref('users/' + userID + '/resultOverlay').set({ 
            active: true, 
            names: winners, 
            isShared: sharedFlag,
            title: sharedFlag ? "BAJI SHARED" : "FINAL RESULT" 
        });
    }
    function setStatus(id, s) {
        let pList = [...localData.pigeons];
        const idx = pList.findIndex(p => p.id === id);
        if(idx === -1) return;

        if(s === 'out' && pList[idx].status !== 'out') {
            pList[idx].outTime = Date.now();
            // 4 Second Flash Animation
            db.ref('users/' + userID + '/cutAnimation').set({ name: pList[idx].name, time: Date.now() });
        }
        
        pList[idx].status = s;
        db.ref('users/' + userID + '/pigeons').set(pList);
    }

    function movePosition(id, newPos) {
        newPos = parseInt(newPos);
        let pList = [...localData.pigeons];
        if (isNaN(newPos) || newPos < 1 || newPos > pList.length) return render();
        
        const oldIndex = pList.findIndex(p => p.id === id);
        const [item] = pList.splice(oldIndex, 1);
        pList.splice(newPos - 1, 0, item);
        db.ref('users/' + userID + '/pigeons').set(pList);
    }

    function render() {
        const list = document.getElementById('listArea');
        list.innerHTML = "";
        let c = { fly:0, time:0, out:0 };
        (localData.pigeons || []).forEach((p, idx) => {
            c[p.status]++;
            list.innerHTML += `
                <div class="pigeon-row">
                    <div class="name-part">
                        <input type="number" class="pos-input" value="${idx+1}" onchange="movePosition('${p.id}', this.value)">
                        <input type="text" class="edit-name-box" value="${p.name}" onblur="updateName('${p.id}', this.value)">
                    </div>
                    <div class="btn-part">
                        <button class="st-btn ${p.status=='fly'?'active':''}" style="background:#3498db" onclick="setStatus('${p.id}','fly')">FLY</button>
                        <button class="st-btn ${p.status=='time'?'active':''}" style="background:#f1c40f" onclick="setStatus('${p.id}','time')">TIME</button>
                        <button class="st-btn ${p.status=='out'?'active':''}" style="background:#e74c3c" onclick="setStatus('${p.id}','out')">OUT</button>
                        <button onclick="delP('${p.id}')" style="background:none; border:none; color:red;">×</button>
                    </div>
                </div>`;
        });
        document.getElementById('sum-total').innerText = (localData.pigeons || []).length;
        document.getElementById('sum-fly').innerText = c.fly;
        document.getElementById('sum-time').innerText = c.time;
        document.getElementById('sum-out').innerText = c.out;
    }

    async function findLocation() {
        const pind = document.getElementById('inpPind').value;
        if (!pind) return;
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${pind}`);
            const d = await res.json();
            if (d.length > 0) {
                document.getElementById('inpLat').value = d[0].lat;
                document.getElementById('inpLon').value = d[0].lon;
                alert("Location Found!");
                manualUpdate();
            }
        } catch(e) {}
    }

    function addP() {
        const names = document.getElementById('pName').value.split(',').filter(n => n.trim() !== "");
        let pList = localData.pigeons || [];
        names.forEach(n => pList.push({ id: "id_"+Date.now()+Math.random(), name: n.trim(), status: 'fly', outTime: 0 }));
        db.ref('users/' + userID + '/pigeons').set(pList);
        document.getElementById('pName').value = "";
    }

    function manualUpdate() {
        db.ref('users/' + userID + '/config').update({
            ticker: document.getElementById('inpTicker').value,
            boxTime: document.getElementById('inpBoxTime').value,
            pindName: document.getElementById('inpPind').value,
            lat: document.getElementById('inpLat').value,
            lon: document.getElementById('inpLon').value
        });
    }

    function toggleDisplay(f) {
        const cur = (localData.config && localData.config[f]) || false;
        db.ref('users/' + userID + '/config/' + f).set(!cur);
    }

    function clearResult() { db.ref('users/' + userID + '/resultOverlay/active').set(false); }
    function updateName(id, n) { 
        let pList = localData.pigeons.map(p => p.id === id ? {...p, name: n} : p);
        db.ref('users/' + userID + '/pigeons').set(pList);
    }
    function delP(id) { if(confirm("Delete?")) db.ref('users/' + userID + '/pigeons').set(localData.pigeons.filter(p => p.id !== id)); }
    function resetData() { if(confirm("Reset All Data?")) { db.ref('users/' + userID + '/pigeons').set([]); clearResult(); } }
</script>
</body>
</html>
