<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - Manpreet Mudki</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f1113; color: white; margin: 0; padding: 10px; text-transform: uppercase; }
        .top-mini-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1d21; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; font-size: 11px; }
        .top-mini-bar b { color: #f39c12; }
        .controls-container { background: #1a1d21; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
        textarea, input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #444; color: white; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box; margin-bottom: 10px; text-transform: uppercase; }
        .btn-add { background: #f39c12; color: black; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; margin-bottom: 10px; text-transform: uppercase; }
        .btn-update { background: #238636; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; }
        .display-controls-box { background: #1a1d21; padding: 10px; border-radius: 10px; border: 1px solid #444; margin-bottom: 15px; }
        .btn-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .toggle-btn { flex: 1; min-width: 100px; padding: 10px; border: none; border-radius: 6px; font-weight: 900; font-size: 11px; cursor: pointer; color: white; text-transform: uppercase; }
        .btn-reset { width: 100%; padding: 10px; background: transparent; color: #ff4d4d; border: 1px solid #ff4d4d; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .admin-sum-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; background: #1a1d21; padding: 12px; border-radius: 12px; border: 1px solid #333; border-bottom: 3px solid #f39c12; }
        .sum-item { text-align: center; font-size: 10px; text-transform: uppercase; color: #aaa; }
        .sum-item b { font-size: 20px; color: #f39c12; display: block; }
        
        /* 🏆 RESULT MANAGER BOX STYLES */
        .result-manager-box { background: #1c2128; border: 2px solid #f39c12; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .result-title { font-size: 13px; font-weight: 900; color: #f39c12; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .res-type-btn { flex: 1; padding: 12px; border: 2px solid #444; border-radius: 8px; font-weight: 900; background: #0d1117; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 13px; transition: all 0.2s; }
        .res-type-btn.active-sanjhi { background: #3498db; border-color: #fff; color: white; box-shadow: 0 0 10px rgba(52, 152, 219, 0.5); }
        .res-type-btn.active-win { background: #e67e22; border-color: #fff; color: white; box-shadow: 0 0 10px rgba(230, 126, 34, 0.5); }
        .btn-show-result { background: #238636; color: white; font-size: 14px; }
        .btn-hide-result { background: #dc3545; color: white; font-size: 14px; }
        
        .section-title { font-size: 14px; font-weight: 900; margin: 15px 0 8px 0; padding-left: 5px; border-left: 4px solid #f39c12; color: #fff; }
        .pigeon-row { background: #21262d; padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; align-items: center; border: 1px solid #30363d; }
        .name-part { flex-grow: 1; display: flex; align-items: center; }
        .edit-name-box { background: transparent; border: 1px solid #444; color: #f39c12; padding: 5px; border-radius: 6px; font-size: 13px; font-weight: bold; width: 85%; margin-left: 5px; outline: none; text-transform: uppercase; }
        .btn-part { display: flex; gap: 5px; align-items: center; }
        .st-btn { border: none; padding: 8px 10px; border-radius: 5px; font-weight: 900; color: white; opacity: 0.35; font-size: 11px; cursor: pointer; min-width: 55px; text-transform: uppercase; }
        .st-btn.active { opacity: 1; border: 1px solid white; box-shadow: 0 0 8px rgba(255,255,255,0.2); }
        .cut-section { background: rgba(231, 76, 60, 0.05); padding: 12px; border-radius: 12px; border: 1px solid rgba(231, 76, 60, 0.3); margin-top: 15px; }
        .cut-row { background: #2a1f21; border: 1px solid #4a282b; }
        .login-box { max-width:350px; margin:80px auto; text-align:center; background:#1a1d21; padding:25px; border-radius:15px; border:1px solid #333; }
        #locStatus { font-size: 10px; margin-bottom: 10px; }
        .pos-input { width: 35px; background: #0d1117; border: 1px solid #444; color: #f39c12; font-size: 11px; text-align: center; border-radius: 4px; padding: 4px; outline: none; }
    </style>
</head>
<body>

<div id="login-box" class="login-box">
    <h2 style="color:#f39c12; font-size: 20px;">ADMIN LOGIN</h2>
    <input type="password" id="adminPass" placeholder="ਪਾਸਵਰਡ ਭਰੋ...">
    <button onclick="checkLogin()" class="btn-add">ENTER CONTROL</button>
</div>

<div id="main-content" style="display:none;">
    <div class="top-mini-bar">
        <span><i class="fas fa-phone-alt"></i> HELP: <b>+91 8699640061</b></span>
        <span><i class="fas fa-calendar-alt"></i> EXPIRY: <b id="expDisp">--</b></span>
    </div>

    <!-- 🏆 🤝 RESULT SETUP MANAGER BOX -->
    <div class="result-manager-box">
        <div class="result-title"><i class="fas fa-trophy"></i> TOURNAMENT RESULT LIVE OVERLAY PANEL</div>
        
        <div class="btn-row">
            <button id="btnResSanjhi" class="res-type-btn" onclick="setResultType('BAJI SANJHI')">🤝 BAJI SANJHI</button>
            <button id="btnResWin" class="res-type-btn" onclick="setResultType('WIN DECLARE')">👑 WIN DECLARE</button>
        </div>

        <textarea id="txtResultDetails" rows="4" placeholder="ਇੱਥੇ ਲਿਖੋ (ਜਿਵੇਂ: ਬਾਜ਼ੀ 3 ਘਰਾਂ ਵਿੱਚ ਸਾਂਝੀ ਹੈ... ਯਾ 1ST: ਮੱਖਣ ਖਾਨ, 2ND: ਕਾਲਾ ਮੁੱਦਕੀ...)" style="margin-top:5px;"></textarea>
        
        <div class="btn-row" style="margin-top: 5px;">
            <button id="btnToggleResultShow" class="toggle-btn btn-show-result" onclick="toggleResultOverlay(true)">👁️ SHOW RESULT ON OVERLAY</button>
            <button id="btnToggleResultHide" class="toggle-btn btn-hide-result" onclick="toggleResultOverlay(false)">🙈 HIDE RESULT</button>
        </div>
    </div>

    <div class="controls-container">
        <textarea id="pName" placeholder="ਟੀਮਾਂ ਦੇ ਨਾਮ ਕੌਮਾ (,) ਪਾ ਕੇ ਲਿਖੋ..."></textarea>
        <button class="btn-add" onclick="addP()">ADD LIST</button>
        <input type="text" id="inpBoxTime" placeholder="ਟਾਈਮ ਬਾਕਸ">
       <!-- Ticker Inputs Section -->
<div id="ticker-manager" class="controls-container">
    <div class="section-title">TICKER SETUP</div>
    <input type="text" id="inpTicker" placeholder="MAIN TICKER TEXT (ALL)">
    <input type="text" id="row1" placeholder="ROW 1 TEXT">
    <input type="text" id="row2" placeholder="ROW 2 TEXT">
    <input type="text" id="row3" placeholder="ROW 3 TEXT">
    <button class="btn-update" onclick="updateTickerRows()">SAVE TICKER ROWS</button>
</div>
        <div class="sewa-copy-box">
    <div class="result-title">SCORE WRITER DETAILS</div>
    <input type="text" id="inpSewaName" placeholder="ਸਕੋਰ ਲਿਖਣ ਵਾਲੇ ਦਾ ਨਾਮ...">
    <button class="btn-copy" onclick="saveSewaName()">SAVE NAME</button>
</div>
        <div style="display: flex; gap: 5px; margin-bottom: 5px;">
            <input type="text" id="inpPind" placeholder="ਪਿੰਡ ਦਾ ਨਾਮ" style="margin-bottom:0;">
            <button onclick="findLocation()" style="width: 50px; background: #3498db; border: none; border-radius: 8px; color: white; cursor: pointer;">
                <i class="fas fa-search"></i>
            </button>
        </div>
        <div id="locStatus"></div>
        <input type="hidden" id="inpLat"><input type="hidden" id="inpLon">
        <button class="btn-update" onclick="manualUpdate()">UPDATE ALL DATA</button>
    </div>

    <div class="display-controls-box">
        <div class="btn-row">
            <button id="scoreBtn" onclick="toggleDisplay('showScoreboard')" class="toggle-btn">SHOW SCORE</button>
            <button id="tickerBtn" onclick="toggleDisplay('showTicker')" class="toggle-btn">SHOW TICKER</button>
            <button id="weatherBtn" onclick="toggleDisplay('showWeather')" class="toggle-btn">SHOW WEATHER</button>
        </div>
        <button class="btn-reset" onclick="resetData()">🔄 RESET FULL TOURNAMENT</button>
    </div>

    <div class="admin-sum-grid">
        <div class="sum-item">TOTAL<b id="sum-total">0</b></div>
        <div class="sum-item">FLY<b id="sum-fly" style="color:#3498db;">0</b></div>
        <div class="sum-item">TIME<b id="sum-time" style="color:#f1c40f;">0</b></div>
        <div class="sum-item">OUT<b id="sum-out" style="color:#e74c3c;">0</b></div>
    </div>

    <div class="section-title">🕊️ ACTIVE TOURNAMENT LIST (FLY / TIME)</div>
    <div id="listArea"></div>

    <div class="cut-section">
        <div class="section-title" style="color: #e74c3c; border-left-color: #e74c3c; margin-top: 0;">❌ CUT PIGEONS LIST (OUT)</div>
        <div id="cutListArea"></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com//" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const urlParams = new URLSearchParams(window.location.search);
    const userID = urlParams.get('id');
    let localData = { pigeons: [], config: {}, resultOverlay: {} };
    let firstLoad = true;

    function checkLogin() {
        if(!userID) { alert("ID MISSING!"); return; }
        db.ref('users/' + userID).once('value', snap => {
            const data = snap.val();
            if(data && data.password.toString() === document.getElementById('adminPass').value) {
                document.getElementById('login-box').style.display = "none";
                document.getElementById('main-content').style.display = "block";
                document.getElementById('expDisp').innerText = data.expiry || "31-12-2026";
                
                db.ref('users/' + userID).on('value', s => { 
                    if(s.val()) { 
                        localData = s.val(); 
                        render(); 
                    } 
                });
            } else { alert("ਗਲਤ ਪਾਸਵਰਡ!"); }
        });
    }

    async function findLocation() {
        const pind = document.getElementById('inpPind').value;
        const status = document.getElementById('locStatus');
        if (!pind) return;
        status.innerText = "Searching...";
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${pind}`);
            const data = await res.json();
            if (data.length > 0) {
                document.getElementById('inpLat').value = data[0].lat;
                document.getElementById('inpLon').value = data[0].lon;
                status.innerText = "Found!";
                manualUpdate(); 
            }
        } catch (e) { console.log(e); }
    }

    function render() {
        const conf = localData.config || {};
        const resOver = localData.resultOverlay || {};
        
        document.getElementById('scoreBtn').innerText = conf.showScoreboard ? "HIDE SCORE" : "SHOW SCORE";
        document.getElementById('scoreBtn').style.backgroundColor = conf.showScoreboard ? "#dc3545" : "#238636";
        document.getElementById('tickerBtn').innerText = conf.showTicker ? "HIDE TICKER" : "SHOW TICKER";
        document.getElementById('tickerBtn').style.backgroundColor = conf.showTicker ? "#dc3545" : "#238636";
        document.getElementById('weatherBtn').innerText = conf.showWeather ? "HIDE WEATHER" : "SHOW WEATHER";
        document.getElementById('weatherBtn').style.backgroundColor = conf.showWeather ? "#dc3545" : "#238636";

        if (firstLoad) {
            document.getElementById('inpTicker').value = conf.ticker || "";
            document.getElementById('inpBoxTime').value = conf.boxTime || "";
            document.getElementById('inpPind').value = conf.pindName || "";
            document.getElementById('inpLat').value = conf.lat || "";
            document.getElementById('inpLon').value = conf.lon || "";
            document.getElementById('txtResultDetails').value = resOver.details || "";
            firstLoad = false;
        }

        document.getElementById('btnResSanjhi').classList.remove('active-sanjhi');
        document.getElementById('btnResWin').classList.remove('active-win');
        if(resOver.title === 'BAJI SANJHI') {
            document.getElementById('btnResSanjhi').classList.add('active-sanjhi');
        } else if(resOver.title === 'WIN DECLARE') {
            document.getElementById('btnResWin').classList.add('active-win');
        }

        if(resOver.active === true) {
            document.getElementById('btnToggleResultShow').style.border = "2px solid white";
            document.getElementById('btnToggleResultShow').style.opacity = "1";
            document.getElementById('btnToggleResultHide').style.opacity = "0.4";
        } else {
            document.getElementById('btnToggleResultHide').style.border = "2px solid white";
            document.getElementById('btnToggleResultHide').style.opacity = "1";
            document.getElementById('btnToggleResultShow').style.opacity = "0.4";
        }

        const mainList = document.getElementById('listArea');
        const cutList = document.getElementById('cutListArea');
        
        mainList.innerHTML = "";
        cutList.innerHTML = "";
        
        let c = { fly:0, time:0, out:0 };
        const pList = localData.pigeons || [];

        pList.forEach((p, idx) => {
            if(p.status === 'fly') c.fly++; 
            else if(p.status === 'time') c.time++; 
            else c.out++;

            let rowHTML = `
                <div class="pigeon-row ${p.status === 'out' ? 'cut-row' : ''}">
                    <div class="name-part"> 
                        <input type="number" class="pos-input" value="${idx+1}" 
                            onkeydown="if(event.key==='Enter') movePosition('${p.id}', this.value)">
                        <input type="text" class="edit-name-box" value="${p.name}" 
                            onblur="updateName('${p.id}', this.value)" 
                            onkeydown="if(event.key==='Enter') this.blur()">
                    </div>
                    <div class="btn-part">
                        <button class="st-btn ${p.status=='fly'?'active':''}" style="background:#3498db" onclick="setStatus('${p.id}','fly')">FLY</button>
                        <button class="st-btn ${p.status=='time'?'active':''}" style="background:#f1c40f" onclick="setStatus('${p.id}','time')">TIME</button>
                        ${p.status !== 'out' ? `<button class="st-btn ${p.status=='out'?'active':''}" style="background:#e74c3c" onclick="setStatus('${p.id}','out')">OUT</button>` : ''}
                        <button onclick="delP('${p.id}')" style="background:none; border:none; color:#ff4d4d; font-size:18px; cursor:pointer; padding-left:5px;">×</button>
                    </div>
                </div>`;

            if (p.status === 'out') { cutList.innerHTML += rowHTML; } 
            else { mainList.innerHTML += rowHTML; }
        });

        document.getElementById('sum-total').innerText = pList.length;
        document.getElementById('sum-fly').innerText = c.fly;
        document.getElementById('sum-time').innerText = c.time;
        document.getElementById('sum-out').innerText = c.out;
    }

    function setResultType(type) {
        db.ref('users/' + userID + '/resultOverlay/title').set(type);
    }

    function toggleResultOverlay(show) {
        const detailsText = document.getElementById('txtResultDetails').value.toUpperCase();
        db.ref('users/' + userID + '/resultOverlay').update({
            active: show,
            details: detailsText
        });
    }

    function movePosition(id, newPos) {
        newPos = parseInt(newPos);
        if (!localData.pigeons) return;
        let pList = [...localData.pigeons];

        if (isNaN(newPos) || newPos < 1 || newPos > pList.length) {
            alert("ਗਲਤ ਨੰਬਰ ਭਰਿਆ ਹੈ!");
            render();
            return;
        }

        const oldIndex = pList.findIndex(p => p.id === id);
        if (oldIndex !== -1) {
            const [movedItem] = pList.splice(oldIndex, 1);
            pList.splice(newPos - 1, 0, movedItem);
            db.ref('users/' + userID + '/pigeons').set(pList).catch((error) => {
                alert("Error: " + error.message);
            });
        }
    }

    function syncPigeons() {
        db.ref('users/' + userID + '/pigeons').set(localData.pigeons || []);
    }


    function manualUpdate() {
    const tickerVal = document.getElementById('inpTicker') ? document.getElementById('inpTicker').value : "";
    
    db.ref('users/' + userID + '/config').update({
        ticker: tickerVal,
        boxTime: document.getElementById('inpBoxTime').value,
        pindName: document.getElementById('inpPind').value,
        lat: document.getElementById('inpLat').value,
        lon: document.getElementById('inpLon').value
    }).then(() => {
        alert("ALL DATA UPDATED!");
    });
}
function saveSewaName() {
    const name = document.getElementById('inpSewaName').value;
    db.ref('users/' + userID + '/config').update({
        sewaName: name
    }).then(() => alert("ਨਾਮ ਸੇਵ ਹੋ ਗਿਆ!"));
}
    function updateName(id, newName) {
        localData.pigeons = localData.pigeons.map(p => p.id == id ? {...p, name: newName.toUpperCase()} : p);
        syncPigeons();
    }

    function addP() {
        const names = document.getElementById('pName').value.split(',').map(n => n.trim().toUpperCase()).filter(n => n !== "");
        if(!localData.pigeons) localData.pigeons = [];
        names.forEach(n => localData.pigeons.push({ id: "id_" + Date.now() + Math.random(), name: n, status: 'fly' }));
        document.getElementById('pName').value = ""; 
        syncPigeons();
    }

    // ⚡ ਸਟੇਟਸ ਬਦਲਣ ਵਾਲਾ ਫੰਕਸ਼ਨ - ਝਮਾਕੇ ਵਾਲੇ SMS (ਟਾਈਮਸਟੈਂਪ) ਸਿਸਟਮ ਦੇ ਨਾਲ ਅਪਡੇਟਿਡ ⚡
    function setStatus(id, s) {
        // ਕਬੂਤਰ ਦਾ ਨਾਮ ਪਤਾ ਕਰੋ ਜਿਸਨੂੰ ਆਊਟ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ
        let targetPigeon = localData.pigeons.find(p => p.id == id);
        
        localData.pigeons = localData.pigeons.map(p => p.id == id ? {...p, status: s} : p);
        
        // ਪਹਿਲਾਂ ਪਿਜਨ ਦਾ ਸਟੇਟਸ ਫਾਇਰਬੇਸ ਵਿੱਚ ਅਪਡੇਟ ਕਰੋ
        db.ref('users/' + userID + '/pigeons').set(localData.pigeons || []).then(() => {
            // ⚡ ਜੇਕਰ ਬਟਨ 'out' ਦੱਬਿਆ ਗਿਆ ਹੈ, ਤਾਂ ਤੁਰੰਤ ਓਵਰਲੇਅ ਲਈ ਝਮਾਕੇ ਦਾ ਮੈਸੇਜ ਭੇਜੋ
            if (s === 'out' && targetPigeon) {
                db.ref('users/' + userID + '/cutAnimation').set({
                    name: targetPigeon.name.toUpperCase(),
                    time: Date.now() // ਹਰ ਵਾਰ ਬਿਲਕੁਲ ਨਵਾਂ ਯੂਨੀਕ ਨੰਬਰ (ਟਾਈਮ)
                });
            }
        });
    }

    function toggleDisplay(field) {
        const currentStatus = (localData.config && localData.config[field]) || false;
        db.ref('users/' + userID + '/config/' + field).set(!currentStatus);
    }

    function delP(id) { if(confirm("Delete?")) { localData.pigeons = localData.pigeons.filter(p => p.id != id); syncPigeons(); } }
    function resetData() { if(confirm("Reset Everything?")) { db.ref('users/' + userID + '/pigeons').set([]); } }
</script>
</body>
</html>
