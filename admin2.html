<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Result Update</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ਪੁਰਾਣਾ ਸਟਾਈਲ */
        body { font-family: 'Segoe UI', sans-serif; background: #0f1113; color: white; margin: 0; padding: 10px; }
        .top-mini-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1d21; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; font-size: 11px; }
        .controls-container { background: #1a1d21; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
        textarea, input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #444; color: white; border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-bottom: 10px; outline: none; }
        .btn-add { background: #f39c12; color: black; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-update { background: #238636; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; }
        .display-controls-box { background: #1a1d21; padding: 12px; border-radius: 10px; border: 1px solid #444; margin-bottom: 15px; }
        
        /* ਨਵਾਂ ਰਿਜ਼ਲਟ ਸੈਕਸ਼ਨ ਸਟਾਈਲ */
        .result-section { border-top: 3px solid #3498db; margin-top: 10px; padding-top: 10px; }
        .res-grid { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn-shared { background: #e67e22; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-hide { background: #555; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        
        /* ਬਾਕੀ ਪੁਰਾਣਾ ਸਟਾਈਲ */
        .pigeon-row { background: #21262d; padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; align-items: center; border: 1px solid #30363d; }
        .st-btn { border: none; padding: 7px; border-radius: 4px; font-weight: 900; width: 45px; color: white; opacity: 0.25; font-size: 10px; cursor: pointer; margin-left: 5px;}
        .st-btn.active { opacity: 1; border: 1px solid white; }
    </style>
</head>
<body>

<div id="login-box" style="max-width:350px; margin:80px auto; text-align:center; background:#1a1d21; padding:25px; border-radius:15px; border:1px solid #333;">
    <h2 style="color:#f39c12; font-size: 20px;">ADMIN LOGIN</h2>
    <input type="password" id="adminPass" placeholder="ਪਾਸਵਰਡ ਭਰੋ...">
    <button onclick="checkLogin()" class="btn-add">ENTER CONTROL</button>
</div>

<div id="main-content" style="display:none;">
    <div class="top-mini-bar">
        <span>HELP: <b>+91 8699640061</b></span>
        <span>EXPIRY: <b id="expDisp">31-12-2026</b></span>
    </div>

    <!-- ਬਾਕੀ ਕੰਟਰੋਲ ਪਹਿਲਾਂ ਵਾਲੇ ਹੀ ਹਨ -->
    <div class="controls-container">
        <textarea id="pName" placeholder="ਟੀਮਾਂ ਦੇ ਨਾਮ ਕੌਮਾ (,) ਪਾ ਕੇ ਲਿਖੋ..."></textarea>
        <button class="btn-add" onclick="addP()">ADD LIST</button>
        <button class="btn-update" onclick="manualUpdate()">UPDATE SETTINGS</button>
    </div>

    <!-- ਨਵਾਂ: RESULT BOX -->
    <div class="display-controls-box result-section">
        <h3 style="margin-top:0; color: #3498db; font-size: 14px;"><i class="fas fa-trophy"></i> BAJI RESULT / SHARED</h3>
        <div class="res-grid">
            <input type="number" id="winnerCount" placeholder="ਕਿੰਨੇ ਇਨਾਮ? (ਜਿਵੇਂ 2 ਜਾਂ 3)" style="margin-bottom:0; flex: 1.5;">
            <button onclick="showResult('winners')" class="btn-update" style="flex: 1; font-size: 11px;">SHOW WINNERS</button>
        </div>
        <div class="res-grid">
            <button onclick="showResult('shared')" class="btn-shared">BAJI SHARED (FLYING)</button>
            <button onclick="hideResult()" class="btn-hide">HIDE RESULT</button>
        </div>
    </div>

    <div id="listArea"></div>
</div>

<script>
    // ਫਾਇਰਬੇਸ ਕੌਂਫਿਗ
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const urlParams = new URLSearchParams(window.location.search);
    const userID = urlParams.get('id');
    let localData = { pigeons: [], config: {} };

    function checkLogin() {
        if(!userID) { alert("ID MISSING!"); return; }
        db.ref('users/' + userID).once('value', snap => {
            const data = snap.val();
            if(data && data.password.toString() === document.getElementById('adminPass').value) {
                document.getElementById('login-box').style.display = "none";
                document.getElementById('main-content').style.display = "block";
                db.ref('users/' + userID).on('value', s => { if(s.val()) { localData = s.val(); render(); } });
            } else { alert("ਗਲਤ ਪਾਸਵਰਡ!"); }
        });
    }

    // RESULT LOGIC
    function showResult(type) {
        let resultObj = { active: true, type: type, names: [], title: "" };

        if (type === 'winners') {
            const count = parseInt(document.getElementById('winnerCount').value);
            if (!count || count < 1) { alert("ਕਿਰਪਾ ਕਰਕੇ ਇਨਾਮਾਂ ਦੀ ਗਿਣਤੀ ਭਰੋ!"); return; }
            
            // ਪਹਿਲੇ 1, 2, 3 ਕਬੂਤਰਾਂ ਦੇ ਨਾਮ ਚੁੱਕਣੇ
            resultObj.names = localData.pigeons.slice(0, count).map(p => p.name);
            resultObj.title = "WINNERS: 1 TO " + count;
        } else {
            // ਸਾਂਝੀ ਬਾਜ਼ੀ: ਸਿਰਫ 'fly' ਵਾਲੇ
            resultObj.names = localData.pigeons.filter(p => p.status === 'fly').map(p => p.name);
            resultObj.title = "BAJI SHARED";
        }

        if(resultObj.names.length === 0) { alert("ਲਿਸਟ ਖਾਲੀ ਹੈ!"); return; }

        // Firebase 'result' ਨੋਡ ਵਿੱਚ ਡਾਟਾ ਭੇਜੋ
        db.ref('users/' + userID + '/result').set(resultObj);
        // ਸਕੋਰਬੋਰਡ ਬੰਦ ਕਰ ਦਿਓ ਤਾਂ ਕਿ ਰਿਜ਼ਲਟ ਸਾਫ ਦਿਖੇ
        db.ref('users/' + userID + '/config/showScoreboard').set(false);
        alert("Result Sent to Overlay!");
    }

    function hideResult() {
        db.ref('users/' + userID + '/result/active').set(false);
        db.ref('users/' + userID + '/config/showScoreboard').set(true);
    }

    // ਬਾਕੀ ਸਾਰੇ ਫੰਕਸ਼ਨ (render, addP, setStatus ਆਦਿ) ਪੁਰਾਣੇ ਹੀ ਰੱਖੋ...
    function render() {
        const list = document.getElementById('listArea');
        list.innerHTML = "";
        const pList = localData.pigeons || [];
        pList.forEach((p, idx) => {
            list.innerHTML += `
                <div class="pigeon-row">
                    <div style="flex-grow:1"><b>${idx+1}.</b> ${p.name}</div>
                    <div class="btn-part">
                        <button class="st-btn ${p.status=='fly'?'active':''}" style="background:#3498db" onclick="setStatus('${p.id}','fly')">FLY</button>
                        <button class="st-btn ${p.status=='time'?'active':''}" style="background:#f1c40f" onclick="setStatus('${p.id}','time')">TIME</button>
                        <button class="st-btn ${p.status=='out'?'active':''}" style="background:#e74c3c" onclick="setStatus('${p.id}','out')">OUT</button>
                    </div>
                </div>`;
        });
    }

    function addP() {
        const names = document.getElementById('pName').value.split(',').map(n => n.trim()).filter(n => n !== "");
        if(!localData.pigeons) localData.pigeons = [];
        names.forEach(n => localData.pigeons.push({ id: "id_" + Date.now() + Math.random(), name: n, status: 'fly' }));
        document.getElementById('pName').value = ""; 
        db.ref('users/' + userID + '/pigeons').set(localData.pigeons);
    }

    function setStatus(id, s) {
        localData.pigeons = localData.pigeons.map(p => p.id == id ? {...p, status: s} : p);
        db.ref('users/' + userID + '/pigeons').set(localData.pigeons);
    }
</script>
</body>
</html>
