    <style>

            box-sizing: border-box;

        }

            color: white;
        }

    position:absolute;

}

#main-logo{
    height:130px;

    object-fit:contain;
}

#single-wm{
    position:absolute;

    font-size:30px;

    text-shadow:2px 2px 5px #000;

}

/* --- CUT FLASH ANIMATION STYLES (CENTER BANNER) --- */
        #cut-flash-alert {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(90deg, rgba(255,0,0,0) 0%, rgba(220,0,0,0.95) 15%, rgba(150,0,0,0.95) 50%, rgba(220,0,0,0.95) 85%, rgba(255,0,0,0) 100%);
            color: #fff;
            width: 100%;
            padding: 25px 0;
            text-align: center;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-top: 5px solid #fff;
            border-bottom: 5px solid #fff;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease-in-out;
        }

        #cut-flash-alert{
    position:absolute;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    display:none;
}

#cut-flash-alert.active{
    display:flex !important;
    animation:alertPopup 4s ease-in-out forwards;
}

        .alert-main-title {
            font-size: 55px;
            font-weight: 1000;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 20px #000, 0 0 10px #ff0000;
            animation: textPulse 0.8s infinite alternate;
        }

        .alert-pigeon-name {
            font-size: 45px;
            font-weight: 900;
            color: #ffcc00;
            margin-top: 5px;
            text-shadow: 0 0 15px #000;
        }

        @keyframes alertPopup {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            10% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            90% { transform: translate(-50%, -50%) scale(1); opacity: 1; filter: brightness(1); }
            95% { filter: brightness(2); }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        }

        @keyframes textPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px #fff); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 15px #ffcc00); }
        }
        /* -------------------------------------------------- */

        /* Weather Box Styling */
        #weather-box {
            position: absolute;
            top: 155px; 
            right: 45px;
            width: 450px; 
            height: 100px; 
            display: none; 
            overflow: hidden;
            background: transparent; 
            border: none;             
            z-index: 1001;
        }

        #weather-frame { 
            width: 550px; 
            height: 100px; 
            border: none; 
            pointer-events: none;
            transform: scale(1.5); 
            transform-origin: top left; 
            margin-top: -10px; 
            margin-left: 5px;
        } 
        
        /* Expiry Lock Screen */
        #expiry-lock {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .lock-msg {
            background: #FFD700;
            color: #000;
            padding: 20px 40px;
            border-radius: 15px;
            border: 4px solid white;
            box-shadow: 0 0 30px rgba(255,215,0,0.5);
        }

        .lock-msg h1 {
            font-size: 45px;
            font-weight: 950;
            margin-bottom: 10px;
        }

        .lock-msg h2 {
            font-size: 30px;
            font-weight: 800;
        }

        .lock-msg p {
            font-size: 22px;
            margin-top: 15px;
            font-weight: bold;
            border-top: 2px solid rgba(0,0,0,0.2);
            padding-top: 10px;
        }

        /* Summary Section */
        .summary-wrapper {
            position: absolute;
            top: 45px;
            right: 550px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .sum-card {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            min-width: 260px;
            height: 75px;
        }

        .sum-label-area {
            background: rgba(0,0,0,0.95);
            width: 65%;
            font-size: 22px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .sum-val-area {
            background: #fff;
            color: #000;
            width: 35%;
            font-size: 40px;
            font-weight: 950;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flash-text::after {
            content: attr(data-pa);
            animation: langFlash 8s infinite;
        }

        @keyframes langFlash {
            0%,45% {
                content: attr(data-pa);
            }

            50%,95% {
                content: attr(data-en);
            }
        }

        /* Winner Result */
        #result-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            width: 680px;
            height: 480px;
            background: rgba(15,17,19,0.98);
            border: 5px solid #f39c12;
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(243,156,18,0.5), inset 0 0 20px rgba(0,0,0,0.9);
            z-index: 3000;
            overflow: hidden;
            display: none;
            flex-direction: column;
        }

        #result-screen::before {
            content: "";
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,243,156,0.1) 50%, transparent);
            animation: slowGhaintLight 10s infinite ease-in-out;
            pointer-events: none;
            z-index: 3010;
        }

        .res-header {
            background: #f39c12;
            color: #000;
            text-align: center;
            padding: 15px 10px;
            font-size: 38px;
            font-weight: 1000;
            letter-spacing: 2px;
            border-bottom: 4px solid #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            z-index: 3005;
        }

        .res-scroll-window {
            flex: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
            background: #050505;
            padding: 20px 25px;
        }

        .res-list-area {
            position: absolute;
            width: calc(100% - 50px);
            will-change: transform;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: resultScroll 25s linear infinite;
        }

        @keyframes resultScroll {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-50%);
            }
        }

        .res-item {
            font-size: 36px;
            font-weight: 1000;
            color: #ffffff;
            letter-spacing: 1.5px;
            padding: 8px 10px;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Containers */
        .main-container {
            position: absolute;
            top: 10px;
            left: 20px;
            bottom: 85px;
            width: 550px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .box {
            display: none;
            flex: 1;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
            border-radius: 5px;
        }

        .box-header {
            height: 50px;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.2);
        }

        #box-fly .box-header {
            background: #0000FF;
        }

        #box-fly {
            background: rgba(0,0,100,0.8);
        }

        #box-time .box-header {
            background: #FFD700;
            color: black;
        }

        #box-time {
            background: rgba(180,150,0,0.8);
            color: black !important;
        }

        #box-out .box-header {
            background: #000000;
        }

        #box-out {
            background: rgba(0,0,0,0.8);
        }

        .header-title {
            font-size: 25px;
            font-weight: 950;
        }

        .count-tag {
            background: white;
            color: black;
            padding: 0 12px;
            border-radius: 4px;
            font-size: 30px;
            font-weight: 950;
            height: 32px;
            display: flex;
            align-items: center;
        }

        .scroll-window {
            position: absolute;
            top: 50px;
            bottom: 0;
            width: 100%;
            overflow: hidden;
        }

        .list-area {
            position: absolute;
            width: 100%;
            animation: constantScroll linear infinite;
            will-change: transform;
        }

        .item {
            padding: 8px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 40px;
            font-weight: 950;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
        }

        .item-num {
            color: #FFD700;
            min-width: 50px;
        }

        #box-time-val {
            font-size: 30px !important;
            font-weight: 950;
            margin-left: 10px;
        }

        #box-time .item,
        #box-time .item-num {
            color: black;
            text-shadow: none;
        }

        @keyframes constantScroll {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-50%);
            }
        }
        
/* ਟਿੱਕਰ ਲਈ ਨਵੀਂ CSS */
/* ਟਿੱਕਰ ਪੱਟੀ */
.footer {

</style>
</head>

<script>

const firebaseConfig = {
    databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const urlParams = new URLSearchParams(window.location.search);

const userID = urlParams.get('id');
    
    const clientSettings = {

    "punjab": {
        logo: "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/image-Photoroom%20(4).png",
        watermark: "PUNJAB TODAY LIVE"
    },

        "dhaliwal 16 6 2026": {
        logo: "https://your-logo-link-2.png",
        watermark: "Dhaliwal PB29 Live"
        },
        
    "ravijhandeana": {
        logo: "https://raw.githubusercontent.com/bhaimanpreetmudki/manpreetpigeons/arshpreet/Ravi%20Live%20Logo.png",
        watermark: "RAVI LIVE TV"
    },
        
        "ravi2": {
        logo: "https://raw.githubusercontent.com/bhaimanpreetmudki/manpreetpigeons/arshpreet/Ravi%20Live%20Logo.png",
        watermark: "RAVI LIVE TV"
    },

        "punjab today live": {
        logo: "https://your-logo-link-2.png",
        watermark: "PUNJAB LIVE"

    }

};

let showTime = true;
let previousAnimationTime = "";
let isResultActive = false;

function updateClock() {

    const now = new Date();

    const el = document.getElementById('dt-flash');

    if(!el) return;

    if(showTime) {

        el.innerText = now.toLocaleTimeString('en-US', {
            hour:'2-digit',
            minute:'2-digit',
            second:'2-digit',
            hour12:true
        }).toUpperCase();

    } else {

        el.innerText = now.toLocaleDateString('en-GB', {
            day:'2-digit',
            month:'short',
            year:'numeric'
        }).toUpperCase();
    }
}

setInterval(() => {
    if(showTime) updateClock();
}, 1000);

setInterval(() => {
    showTime = !showTime;
    updateClock();
}, 10000);

updateClock();

    if(clientSettings[userID]){

    document.getElementById("main-logo").src =
        clientSettings[userID].logo;

    document.getElementById("single-wm").innerText =
        clientSettings[userID].watermark;
}

        

// WATERMARK MOVE
const wmEl = document.getElementById("single-wm");

function moveWM() {

    if (!wmEl.innerText) return;

    const maxX = window.innerWidth - wmEl.offsetWidth - 20;
    const maxY = window.innerHeight - wmEl.offsetHeight - 20;

    wmEl.style.left = Math.floor(Math.random() * maxX) + "px";
    wmEl.style.top = Math.floor(Math.random() * maxY) + "px";
}

moveWM();
setInterval(moveWM, 6000);

    // ਫਲੈਸ਼ ਐਨੀਮੇਸ਼ਨ ਚਲਾਉਣ ਵਾਲਾ ਫੰਕਸ਼ਨ
    let cutTimeout1 = null;
let cutTimeout2 = null;

function triggerCutFlash(name) {

    const alertBox = document.getElementById('cut-flash-alert');
    const nameBox = document.getElementById('alert-pigeon-name');

    if (cutTimeout1) clearTimeout(cutTimeout1);
    if (cutTimeout2) clearTimeout(cutTimeout2);

    nameBox.innerText = name ? name.toUpperCase() : "--";

    alertBox.classList.remove('active');
    alertBox.style.display = "none";

    void alertBox.offsetWidth;

    cutTimeout1 = setTimeout(() => {

        alertBox.classList.add('active');

        cutTimeout2 = setTimeout(() => {
            alertBox.classList.remove('active');
            alertBox.style.display = "none";
        }, 4000);

    }, 30);
}


if(userID) {

    db.ref('users/' + userID).on('value', snap => {

        const data = snap.val();

        if(!data) return;

        const pigeons = data.pigeons || [];
        const conf = data.config || {};
        const resOver = data.resultOverlay || {};

        const footerElem = document.querySelector('.footer');

        if(conf.showTicker === false) {
            footerElem.style.display = "none";
        } else {
            footerElem.style.display = "flex";
        }

        const resScreen = document.getElementById('result-screen');
        const resArea = document.getElementById('res-list-render');
        const scoreboardElem = document.getElementById('scoreboard-div');
        const summaryElem = document.getElementById('summary-div');


        /* RESULT OVERLAY */

        if(resOver.active === true) {

            isResultActive = true;

            resScreen.style.display = "flex";

            /* HIDE SCOREBOARD + SUMMARY */
            scoreboardElem.style.display = "none";
            summaryElem.style.display = "none";

            document.getElementById('res-title-text').innerText =
                resOver.title || "FINAL RESULT";

            let detailsText = resOver.details || "";
            let linesArr = [];

            if(detailsText.trim() === "") {

                pigeons.forEach((p, idx) => {

                    if(p.name && p.status === 'fly') {

                        let originalNumber = idx + 1;

                        linesArr.push(`
                            <div class="res-item">
                                ${originalNumber}. ${p.name.toUpperCase()}
                            </div>
                        `);
                    }
                });

            } else {

                let rawLines = detailsText.split(/[\n,]+/);

                rawLines.forEach(line => {

                    if(line.trim() !== "") {

                        linesArr.push(`
                            <div class="res-item">
                                ${line.trim().toUpperCase()}
                            </div>
                        `);
                    }
                });
            }

            const finalHtmlContent = linesArr.join('');

            resArea.innerHTML = `
                <div class="res-block">${finalHtmlContent}</div>
                <div style="height:150px"></div>
                <div class="res-block">${finalHtmlContent}</div>
                <div style="height:150px"></div>
            `;

        } else {

            isResultActive = false;

            resScreen.style.display = "none";

            resArea.innerHTML = "";

            /* SHOW SCOREBOARD AGAIN */
            scoreboardElem.style.display =
                conf.showScoreboard ? "flex" : "none";

            summaryElem.style.display =
                conf.showScoreboard ? "flex" : "none";
        }

        /* WEATHER */

        const wBox = document.getElementById('weather-box');
        const wFrame = document.getElementById('weather-frame');

        if(conf.showWeather === true) {

            wBox.style.display = "block";

            let lat = conf.lat || "30.5980";
            let lon = conf.lon || "74.7380";
            let p_name = conf.pindName || "";

            const wUrl =
                `https://maxpunjab.com/weather/overlay.php?lat=${lat}&lon=${lon}&name=${encodeURIComponent(p_name)}`;

            if(wFrame.src !== wUrl) {
                wFrame.src = wUrl;
            }

        } else {

            wBox.style.display = "none";
        }

        
        /* CUT FLASH */

        if(data.cutAnimation && data.cutAnimation.time) {

            let currentAnimTime =
                String(data.cutAnimation.time);

            if(currentAnimTime !== previousAnimationTime) {

                previousAnimationTime = currentAnimTime;

                triggerCutFlash(data.cutAnimation.name);
            }
        }

        /* EXPIRY */

        const expiryTime = new Date(data.expiry).getTime();
        const currentTime = new Date().getTime();

        if(currentTime > expiryTime) {

            document.getElementById('expiry-lock').style.display = 'flex';

            return;

        } else {

            document.getElementById('expiry-lock').style.display = 'none';
        }

        /* TICKER */

       // ਫਾਇਰਬੇਸ ਤੋਂ ਟਿੱਕਰ ਅਪਡੇਟ ਕਰਨ ਲਈ
function updateTickerContent(id, txt) {
    const el = document.getElementById(id);
    if (el) {
        el.innerText = `${txt}  •  ${txt}  •  ${txt}`;
    }
}

// ਡਾਟਾ ਪ੍ਰਾਪਤ ਹੋਣ 'ਤੇ ਇਸਨੂੰ ਕਾਲ ਕਰੋ:
// updateTickerContent('c1', data.row1Txt);
// updateTickerContent('c2', data.row2Txt);
// updateTickerContent('c3', data.row3Txt);
      
        /* COUNTS */

        let counts = {
            fly:0,
            out:0,
            time:0
        };

        let htmls = {
            fly:'',
            out:'',
            time:''
        };

        pigeons.forEach((p, idx) => {

            let row = `
                <div class="item">
                    <span class="item-num">${idx + 1}.</span>
                    <span>${p.name}</span>
                </div>
            `;

            if(p.status === 'fly') {

                counts.fly++;
                htmls.fly += row;

            } else if(p.status === 'time') {

                counts.time++;
                htmls.time += row;

            } else if(p.status === 'out') {

                counts.out++;
                htmls.out += row;
            }
        });

        document.getElementById('m-total').innerText =
            pigeons.length;

        document.getElementById('m-rem').innerText =
            pigeons.length - counts.out;

        document.getElementById('m-time').innerText =
            counts.time;

        /* BOXES */

        ['fly','time','out'].forEach(id => {

            const el = document.getElementById(`box-${id}`);

            const listArea =
                document.getElementById(`list-${id}`);

            if(counts[id] > 0) {

                el.style.display = "block";

                document.getElementById(`count-${id}`).innerText =
                    counts[id];

                let gap = '<div style="height:300px;"></div>';

                listArea.innerHTML =
                    htmls[id] + gap + htmls[id] + gap;

                let speedPixelsPerSecond = 45;

                let totalHeight =
                    listArea.scrollHeight / 2;

                listArea.style.animationDuration =
                    (totalHeight / speedPixelsPerSecond) + "s";

            } else {

                el.style.display = "none";    
            }
        });
    });
}

</script>

</body>
</html>
