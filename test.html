<!DOCTYPE html>
<html>
<head>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #flash-box {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 40px;
            background: rgba(255, 0, 0, 0.9);
            color: white;
            font-size: 80px;
            font-weight: bold;
            border: 10px solid white;
            text-transform: uppercase;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 0 50px red;
            animation: blink 0.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="flash-box">CUT - <span id="pName"></span></div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    
    // URL ਤੋਂ ID ਚੱਕੋ (ਜਿਵੇਂ: overlay.html?id=harvinder)
    const userID = new URLSearchParams(window.location.search).get('id');
    const box = document.getElementById('flash-box');

    // Firebase ਤੇ ਨਜ਼ਰ ਰੱਖੋ
    firebase.database().ref('users/' + userID + '/cutAnimation').on('value', (snap) => {
        const data = snap.val();
        if (data) {
            // ਨਵਾਂ ਕੱਟਿਆ ਕਬੂਤਰ ਦਿਖਾਓ
            document.getElementById('pName').innerText = data.name;
            box.style.display = "block";
            
            // 5 ਸਕਿੰਟ ਬਾਅਦ ਬੰਦ ਕਰ ਦਿਓ
            setTimeout(() => { box.style.display = "none"; }, 5000);
        }
    });
</script>
</body>
</html>
