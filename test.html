<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; text-transform: uppercase; }
        body { background: transparent; font-family: sans-serif; overflow: hidden; height: 100vh; position: relative; }

        /* ⚡ IPL ਸਟਾਈਲ ਸੈਂਟਰ ਫਲੈਸ਼ ⚡ */
        #ipl-flash {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 800px; height: 200px; background: linear-gradient(90deg, #ff0000 0%, #8b0000 100%);
            border: 10px solid #fff; border-radius: 20px; display: none;
            justify-content: center; align-items: center; flex-direction: column;
            color: #fff; z-index: 9999; box-shadow: 0 0 50px rgba(255,0,0,0.8);
        }
        .flash-text { font-size: 60px; font-weight: 1000; letter-spacing: 5px; }
        .flash-name { font-size: 80px; font-weight: 1000; color: #ffcc00; }
        .ipl-active { display: flex !important; animation: iplAnim 2s ease-out; }
        @keyframes iplAnim {
            0% { transform: translate(-50%, -50%) scale(0); }
            20% { transform: translate(-50%, -50%) scale(1.2); }
            40% { transform: translate(-50%, -50%) scale(1); }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* ਤੁਹਾਡਾ ਬਾਕੀ ਡਿਜ਼ਾਈਨ */
        .main-container { position: absolute; left: 10px; right: 10px; bottom: 60px; height: 280px; display: flex; gap: 10px; }
        .box { width: 33%; height: 100%; background: rgba(0,0,0,0.8); color: #fff; border: 3px solid #fff; border-radius: 15px; overflow: hidden; }
        .item { padding: 8px; font-size: 35px; font-weight: 1000; border-bottom: 1px solid #333; }
        .ticker-wrap { position: absolute; bottom: 0; width: 100%; height: 50px; background: #fff; color: #000; font-size: 30px; font-weight: 1000; display: flex; align-items: center; overflow: hidden; }
    </style>
</head>
<body>

<!-- IPL ਫਲੈਸ਼ -->
<div id="ipl-flash">
    <div class="flash-text">OUT</div>
    <div class="flash-name" id="flash-name">--</div>
</div>

<!-- ਸਕੋਰਬੋਰਡ -->
<div class="main-container">
    <div id="box-fly" class="box"><div id="list-fly"></div></div>
    <div id="box-out" class="box"><div id="list-out"></div></div>
    <div id="box-time" class="box"><div id="list-time"></div></div>
</div>

<!-- ਟਿੱਕਰ -->
<div class="ticker-wrap"><div id="ticker-text"></div></div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userID = new URLSearchParams(window.location.search).get('id');
    let lastAnimTime = 0;

    if(userID) {
        db.ref('users/' + userID).on('value', snap => {
            const data = snap.val();
            if(!data) return;

            // ਫਲੈਸ਼ ਚੈੱਕ
            if(data.cutAnimation && data.cutAnimation.time !== lastAnimTime) {
                lastAnimTime = data.cutAnimation.time;
                triggerIPLFlash(data.cutAnimation.name);
            }

            // ਲਿਸਟਾਂ ਅਪਡੇਟ
            const pigeons = data.pigeons || [];
            ['fly','out','time'].forEach(type => {
                document.getElementById('list-'+type).innerHTML = pigeons.filter(p => p.status === type)
                                        .map((p, i) => `<div class="item">${i+1}. ${p.name}</div>`).join('');
            });
            
            document.getElementById('ticker-text').innerText = data.config?.ticker || "WELCOME TO LIVE";
        });
    }

    function triggerIPLFlash(name) {
        const flash = document.getElementById('ipl-flash');
        document.getElementById('flash-name').innerText = name;
        flash.classList.remove('ipl-active');
        void flash.offsetWidth; // Reset animation
        flash.classList.add('ipl-active');
    }
</script>
</body>
</html>
