<!-- ਨਵਾਂ ਬਟਨ - ਸਕਰੀਨ ਦੇ ਕੋਨੇ ਵਿੱਚ ਰੱਖੋ -->
<button id="toggle-btn" style="position:fixed; top:5px; left:5px; z-index:9999; padding:10px; cursor:pointer;">
    SWITCH VIEW
</button>

<!-- ਨਵਾਂ REST BOX (Main-container ਦੇ ਅੰਦਰ) -->
<div id="box-rest" class="box" style="display:none; background: rgba(100, 0, 0, 0.8);">
    <div class="box-header" style="background: #8B0000;">
        <span class="header-title">REST PIGEONS</span>
        <span id="count-rest" class="count-tag">0</span>
    </div>
    <div class="scroll-window"><div class="list-area" id="list-rest"></div></div>
</div>

<script>
    let showRest = false; // Toggle ਸਟੇਟ
    document.getElementById('toggle-btn').onclick = () => { showRest = !showRest; };

    // Firebase callback ਦੇ ਅੰਦਰ ਇਹ ਲੌਜਿਕ ਵਰਤੋ:
    // ... ਪਿਛਲਾ ਕੋਡ ...
    
    // ਕਬੂਤਰਾਂ ਨੂੰ ਫਿਲਟਰ ਕਰਨ ਵੇਲੇ:
    let counts = { fly:0, out:0, time:0, rest:0 }; 
    let htmls = { fly:'', out:'', time:'', rest:'' };

    pigeons.forEach((p, idx) => {
        let row = `<div class="item"><span class="item-num">${idx + 1}.</span><span>${p.name}</span></div>`;
        if (p.status === 'fly') { counts.fly++; htmls.fly += row; }
        else if (p.status === 'time') { counts.time++; htmls.time += row; }
        else if (p.status === 'out') { counts.out++; htmls.out += row; }
        else if (p.status === 'rest') { counts.rest++; htmls.rest += row; }
    });

    // Toggle Logic
    const scoreboardDiv = document.getElementById('scoreboard-div');
    const restBox = document.getElementById('box-rest');

    if (showRest && counts.rest > 0) {
        // Rest Box ਦਿਖਾਓ, ਬਾਕੀ ਹਾਈਡ ਕਰੋ
        restBox.style.display = "block";
        document.getElementById('box-fly').style.display = "none";
        document.getElementById('box-time').style.display = "none";
        document.getElementById('box-out').style.display = "none";
        // Rest box ਦਾ ਡਾਟਾ ਭਰੋ (ਉੱਪਰ ਦਿੱਤੇ ਤਰੀਕੇ ਨਾਲ)
    } else {
        // ਆਮ ਤਰੀਕੇ ਨਾਲ ਸਭ ਦਿਖਾਓ
        restBox.style.display = "none";
        // ... ਬਾਕੀ boxes ਦਾ logic ...
    }
</script>
