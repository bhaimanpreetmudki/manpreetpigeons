<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADMIN PANEL</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f1113; color: white; margin: 0; padding: 10px; text-transform: uppercase; }
        .top-mini-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1d21; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; font-size: 11px; }
        .controls-container { background: #1a1d21; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
        textarea, input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #444; color: white; border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-bottom: 10px; }
        .btn-add { background: #f39c12; color: black; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-update { background: #238636; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; }
        .pigeon-row { background: #21262d; padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; align-items: center; border: 1px solid #30363d; }
        .pos-input { width: 40px; background: #0d1117; border: 1px solid #444; color: #f39c12; font-size: 12px; text-align: center; border-radius: 4px; padding: 4px; margin-right: 5px; }
        .edit-name-box { background: transparent; border: 1px solid #444; color: #fff; padding: 5px; border-radius: 6px; width: 100%; margin-left: 5px; }
        .st-btn { border: none; padding: 6px 8px; border-radius: 5px; font-weight: bold; opacity: 0.3; cursor: pointer; font-size: 10px; margin-left: 3px; }
        .st-btn.active { opacity: 1; border: 1px solid #fff; }
    </style>
</head>
<body>

<div id="login-box" style="text-align:center; margin-top:50px;">
    <input type="password" id="adminPass" placeholder="ਪਾਸਵਰਡ...">
    <button onclick="checkLogin()" class="btn-add">ENTER</button>
</div>

<div id="main-content" style="display:none;">
    <div class="controls-container">
        <textarea id="pName" placeholder="ਨਾਮ ਲਿਖੋ (ਕੌਮਾ ਪਾ ਕੇ)..."></textarea>
        <button class="btn-add" onclick="addP()">ADD PIGEONS</button>
        <button class="btn-update" onclick="manualUpdate()">UPDATE ALL</button>
    </div>
    <div id="listArea"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userID = new URLSearchParams(window.location.search).get('id');
    let localData = { pigeons: [] };

    function checkLogin() {
        db.ref('users/' + userID).once('value', snap => {
            if(snap.val() && snap.val().password == document.getElementById('adminPass').value) {
                document.getElementById('login-box').style.display = "none";
                document.getElementById('main-content').style.display = "block";
                db.ref('users/' + userID).on('value', s => { localData = s.val() || {pigeons:[]}; render(); });
            } else { alert("ਗਲਤ ਪਾਸਵਰਡ!"); }
        });
    }

    function render() {
        const listArea = document.getElementById('listArea');
        listArea.innerHTML = "";
        (localData.pigeons || []).forEach((p, idx) => {
            let row = document.createElement('div');
            row.className = 'pigeon-row';
            row.innerHTML = `
                <input type="number" class="pos-input" value="${idx + 1}" onchange="moveP('${p.id}', this.value)">
                <input type="text" class="edit-name-box" value="${p.name}" onblur="updateName('${p.id}', this.value)">
                <div>
                    <button class="st-btn ${p.status=='fly'?'active':''}" style="background:#3498db" onclick="setStatus('${p.id}','fly')">FLY</button>
                    <button class="st-btn ${p.status=='time'?'active':''}" style="background:#f1c40f" onclick="setStatus('${p.id}','time')">TIME</button>
                    <button class="st-btn ${p.status=='out'?'active':''}" style="background:#e74c3c" onclick="setStatus('${p.id}','out')">OUT</button>
                </div>
            `;
            listArea.appendChild(row);
        });
    }

    function updateName(id, name) {
        localData.pigeons = localData.pigeons.map(p => p.id == id ? {...p, name: name.toUpperCase()} : p);
        sync();
    }

    function setStatus(id, s) {
        localData.pigeons = localData.pigeons.map(p => p.id == id ? {...p, status: s} : p);
        if(s === 'out') {
            db.ref('users/' + userID + '/cutAnimation').set({ name: localData.pigeons.find(p => p.id == id).name, time: Date.now() });
        }
        sync();
    }

    function moveP(id, newPos) {
        let pList = [...localData.pigeons];
        let item = pList.find(p => p.id == id);
        pList = pList.filter(p => p.id != id);
        pList.splice(newPos - 1, 0, item);
        localData.pigeons = pList;
        sync();
    }

    function addP() {
        let names = document.getElementById('pName').value.split(',').map(n => n.trim().toUpperCase());
        names.forEach(n => { if(n) localData.pigeons.push({id: "id_"+Date.now()+Math.random(), name: n, status: 'fly'}); });
        document.getElementById('pName').value = "";
        sync();
    }

    function sync() {
        db.ref('users/' + userID + '/pigeons').set(localData.pigeons);
    }
</script>
</body>
</html>
