<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; text-transform: uppercase; margin: 0; padding: 0; }
        body { background: transparent; font-family: sans-serif; overflow: hidden; height: 100vh; position: relative; }

        /* 🔴 ਝਮਾਕਾ ਬਾਕਸ (ਪੁਰਾਣਾ ਸਟਾਈਲ) */
        #cut-flash-alert {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,0,0,0.9) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 9999; display: none; flex-direction: column;
            justify-content: center; align-items: center; pointer-events: none;
        }
        
        .alert-pigeon-name { font-size: 120px; font-weight: 1000; color: #fff; text-shadow: 0 0 30px #000; }
        .alert-main-title { font-size: 60px; color: #ffcc00; font-weight: bold; }

        .active { display: flex !important; animation: flashEffect 0.8s ease-out; }

        @keyframes flashEffect {
            0% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.1); }
            40% { transform: scale(0.9); }
            60% { transform: scale(1.05); }
            100% { opacity: 0; transform: scale(1); }
        }

        /* ਬਾਕੀ ਸਾਰੇ ਸਟਾਈਲ ਤੁਹਾਡੇ ਪੁਰਾਣੇ ਵਾਲੇ ਹੀ ਰਹਿਣਗੇ */
        .main-container { position: absolute; left: 10px; right: 10px; bottom: 60px; height: 280px; display: flex; gap: 10px; }
        .box { width: 33%; height: 100%; background: #000; color: #fff; border: 4px solid #fff; border-radius: 20px; overflow: hidden; }
        .item { padding: 10px; font-size: 40px; font-weight: 1000; }
        .ticker-wrap { position: absolute; bottom: 0; width: 100%; height: 50px; background: #fff; color: #000; font-size: 35px; font-weight: 1000; display: flex; align-items: center; overflow: hidden; }
    </style>
</head>
<body>

<div id="cut-flash-alert">
    <div class="alert-main-title">ਕਬੂਤਰ ਕੱਟਿਆ ਗਿਆ</div>
    <div class="alert-pigeon-name" id="alert-pigeon-name">--</div>
</div>

<div class="main-container" id="scoreboard-div">
    <div id="box-fly" class="box"><div class="list-area" id="list-fly"></div></div>
    <div id="box-out" class="box"><div class="list-area" id="list-out"></div></div>
    <div id="box-time" class="box"><div class="list-area" id="list-time"></div></div>
</div>

<div class="ticker-wrap"><div id="ticker-text"></div></div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userID = new URLSearchParams(window.location.search).get('id');
    let lastAnimTime = 0;

    if(userID) {
        db.ref('users/' + userID).on('value', snap => {
            const data = snap.val();
            if(!data) return;

            // ⚡ ਝਮਾਕਾ ਚੈੱਕ (ਸਭ ਤੋਂ ਇੰਪੋਰਟੈਂਟ)
            if(data.cutAnimation && data.cutAnimation.time !== lastAnimTime) {
                lastAnimTime = data.cutAnimation.time;
                showFlash(data.cutAnimation.name);
            }

            // ਸਕੋਰਬੋਰਡ ਅਪਡੇਟ (ਤੁਹਾਡਾ ਪੁਰਾਣਾ ਕੋਡ)
            const pigeons = data.pigeons || [];
            ['fly','out','time'].forEach(type => {
                const list = document.getElementById('list-'+type);
                list.innerHTML = pigeons.filter(p => p.status === type)
                                        .map((p, i) => `<div class="item">${i+1}. ${p.name}</div>`).join('');
            });
        });
    }

    function showFlash(name) {
        const alertBox = document.getElementById('cut-flash-alert');
        const nameBox = document.getElementById('alert-pigeon-name');
        
        nameBox.innerText = name;
        alertBox.classList.remove('active');
        
        // Force reflow
        void alertBox.offsetWidth; 
        
        alertBox.classList.add('active');
        
        // 1 ਸਕਿੰਟ ਬਾਅਦ ਬੰਦ
        setTimeout(() => {
            alertBox.classList.remove('active');
        }, 1000);
    }
</script>
</body>
</html>
