<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADMIN PANEL - FIXED</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #0f1113; color: white; font-family: sans-serif; padding: 10px; }
        .pigeon-row { background: #1a1d21; border: 1px solid #333; padding: 10px; margin-bottom: 5px; border-radius: 8px; display: flex; align-items: center; }
        .status-btn { padding: 5px 10px; border: none; cursor: pointer; border-radius: 4px; margin-left: 5px; color: white; }
        .active { border: 2px solid white; }
        input { padding: 10px; background: #000; border: 1px solid #444; color: white; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="login-screen">
    <input type="password" id="pass" placeholder="PASSWORD">
    <button onclick="login()" style="width:100%; padding:10px; background:orange;">LOGIN</button>
</div>

<div id="main-ui" style="display:none;">
    <input type="text" id="addInput" placeholder="ਨਾਮ ਲਿਖੋ...">
    <button onclick="addP()" style="width:100%; padding:10px; background:green; color:white;">ADD</button>
    <div id="listArea" style="margin-top:20px;"></div>
</div>

<script>
    const config = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(config);
    const db = firebase.database();
    const userID = new URLSearchParams(window.location.search).get('id');
    
    let dbRef = null;

    function login() {
        let p = document.getElementById('pass').value;
        db.ref('users/' + userID).once('value', s => {
            if(s.val() && s.val().password == p) {
                document.getElementById('login-screen').style.display = "none";
                document.getElementById('main-ui').style.display = "block";
                
                // ਅਸਲੀ ਲਿਸਨਰ
                dbRef = db.ref('users/' + userID + '/pigeons');
                dbRef.on('value', snap => {
                    console.log("Data Updating...");
                    render(snap.val() || []);
                });
            } else { alert("Wrong Password"); }
        });
    }

    function render(list) {
        let area = document.getElementById('listArea');
        area.innerHTML = "";
        list.forEach((p, i) => {
            let row = document.createElement('div');
            row.className = 'pigeon-row';
            row.innerHTML = `
                <div style="flex-grow:1">${p.name}</div>
                <button class="status-btn ${p.status=='fly'?'active':''}" style="background:blue" onclick="setS('${p.id}', 'fly')">FLY</button>
                <button class="status-btn ${p.status=='time'?'active':''}" style="background:gold" onclick="setS('${p.id}', 'time')">TIME</button>
                <button class="status-btn ${p.status=='out'?'active':''}" style="background:red" onclick="setS('${p.id}', 'out')">OUT</button>
            `;
            area.appendChild(row);
        });
    }

    function addP() {
        let name = document.getElementById('addInput').value;
        if(!name) return;
        dbRef.once('value', s => {
            let list = s.val() || [];
            list.push({id: "id"+Date.now(), name: name, status: 'fly'});
            dbRef.set(list);
            document.getElementById('addInput').value = "";
        });
    }

    function setS(id, status) {
        dbRef.once('value', s => {
            let list = s.val() || [];
            list = list.map(p => p.id == id ? {...p, status: status} : p);
            dbRef.set(list);
        });
    }
</script>
</body>
</html>
