<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; text-transform: uppercase; margin: 0; padding: 0; }
        body { background: transparent; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; height: 100vh; color: white; }

        /* RESULT OVERLAY */
        #result-overlay {
            display: none; position: fixed; top: 5%; left: 5%; width: 90%; height: 90%;
            background: rgba(0, 0, 0, 0.95); border: 8px solid #FFD700;
            color: white; padding: 40px; z-index: 9999; border-radius: 20px; text-align: center;
        }
        #res-title { font-size: 70px; color: #FFD700; font-weight: 950; margin-bottom: 30px; }
        #res-details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; font-size: 40px; font-weight: bold; }

        /* Weather, Expiry, Summary, Containers, Footer (ਪੂਰਾ ਡਿਜ਼ਾਈਨ) */
        #weather-box { position: absolute; bottom: 70px; left: 835px; width: 550px; height: 120px; display: none; overflow: hidden; background: transparent; border: none; z-index: 1001; }
        #weather-frame { width: 550px; height: 120px; border: none; pointer-events: none; transform: scale(1.5); transform-origin: top left; margin-top: -10px; margin-left: 5px; }
        #expiry-lock { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .lock-msg { background: #FFD700; color: #000; padding: 20px 40px; border-radius: 15px; border: 4px solid white; }
        .summary-wrapper { position: absolute; bottom: 95px; left: 15px; display: flex; gap: 15px; z-index: 1000; }
        .sum-card { display: flex; border-radius: 8px; overflow: hidden; border: 2px solid rgba(255,255,255,0.4); min-width: 260px; height: 75px; }
        .sum-label-area { background: rgba(0, 0, 0, 0.95); width: 65%; font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
        .sum-val-area { background: #fff; color: #000; width: 35%; font-size: 40px; font-weight: 950; display: flex; align-items: center; justify-content: center; }
        .main-container { position: absolute; top: 10px; right: 20px; bottom: 85px; width: 400px; display: flex; flex-direction: column; gap: 10px; }
        .box { display: none; flex: 1; overflow: hidden; position: relative; border: 1px solid rgba(255, 255, 255, 0.8); backdrop-filter: blur(5px); border-radius: 5px; }
        .box-header { height: 50px; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255,255,255,0.2); }
        .scroll-window { position: absolute; top: 50px; bottom: 0; width: 100%; overflow: hidden; }
        .list-area { position: absolute; width: 100%; animation: constantScroll linear infinite; will-change: transform; }
        @keyframes constantScroll { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
        .item { padding: 8px 25px; display: flex; align-items: center; gap: 15px; font-size: 40px; font-weight: 950; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .item-num { color: #FFD700; min-width: 50px; }
        .footer { position: absolute; bottom: 0; width: 100%; height: 80px; background: #000; display: flex; align-items: center; border-top: 6px solid #FFD700; }
        .ticker-wrap { flex: 1; overflow: hidden; white-space: nowrap; color: #fff; font-size: 35px; }
        .ticker-move { display: inline-block; padding-left: 100%; animation: ticker 65s linear infinite; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
    </style>
</head>
<body>

<div id="result-overlay">
    <div id="res-title">RESULT</div>
    <div id="res-details"></div>
</div>

<div id="weather-box"><iframe id="weather-frame" src=""></iframe></div>
<div id="expiry-lock"><div class="lock-msg"><h1>PLAN EXPIRED</h1><p>RECHARGE: 86996-40061</p></div></div>

<div class="summary-wrapper" id="summary-div">
    <div class="sum-card"><div class="sum-label-area">TOTAL</div><div id="m-total" class="sum-val-area">0</div></div>
    <div class="sum-card"><div class="sum-label-area">REM</div><div id="m-rem" class="sum-val-area">0</div></div>
    <div class="sum-card"><div class="sum-label-area">TIME</div><div id="m-time" class="sum-val-area">0</div></div>
</div>

<div class="main-container" id="scoreboard-div">
    <div id="box-fly" class="box"><div class="box-header"><span class="header-title">FLYING</span><span id="count-fly" class="count-tag">0</span></div><div class="scroll-window"><div class="list-area" id="list-fly"></div></div></div>
    <div id="box-time" class="box"><div class="box-header"><span class="header-title">TIME</span><span id="count-time" class="count-tag">0</span></div><div class="scroll-window"><div class="list-area" id="list-time"></div></div></div>
    <div id="box-out" class="box"><div class="box-header"><span class="header-title">OUT</span><span id="count-out" class="count-tag">0</span></div><div class="scroll-window"><div class="list-area" id="list-out"></div></div></div>
</div>

<div class="footer" id="ticker-div">
    <div class="ticker-wrap"><div id="ticker-text" class="ticker-move">WELCOME</div></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userID = new URLSearchParams(window.location.search).get('id');

    db.ref('users/' + userID).on('value', snap => {
        const data = snap.val(); if(!data) return;
        const conf = data.config || {};
        const pigeons = data.pigeons || [];
        const res = data.resultOverlay || {};

        // Result Logic
        if(res.active) {
            document.getElementById('scoreboard-div').style.display = "none";
            document.getElementById('summary-div').style.display = "none";
            document.getElementById('result-overlay').style.display = "block";
            document.getElementById('res-title').innerText = res.title || "RESULT";
            
            let detailsHtml = "";
            if(res.details && res.details.trim() !== "") {
                let teams = res.details.split(/[,\n]+/);
                teams.forEach(t => detailsHtml += `<div style="border:1px solid #444; padding:10px;">${t.trim()}</div>`);
            } else {
                pigeons.forEach(p => { if(p.status === 'fly') detailsHtml += `<div style="padding:10px;">${p.name}</div>`; });
            }
            document.getElementById('res-details').innerHTML = detailsHtml;
        } else {
            document.getElementById('scoreboard-div').style.display = "flex";
            document.getElementById('summary-div').style.display = "flex";
            document.getElementById('result-overlay').style.display = "none";
        }

        // Expiry
        if (new Date().getTime() > new Date(data.expiry).getTime()) { document.getElementById('expiry-lock').style.display = 'flex'; return; }
        
        // Stats
        let counts = { fly:0, out:0, time:0 }; 
        let htmls = { fly:'', out:'', time:'' };
        pigeons.forEach((p, idx) => {
            let row = `<div class="item"><span class="item-num">${idx + 1}.</span><span>${p.name}</span></div>`;
            if (p.status === 'fly') { counts.fly++; htmls.fly += row; }
            else if (p.status === 'time') { counts.time++; htmls.time += row; }
            else if (p.status === 'out') { counts.out++; htmls.out += row; }
        });
        document.getElementById('m-total').innerText = pigeons.length;
        document.getElementById('m-rem').innerText = pigeons.length - counts.out;
        document.getElementById('m-time').innerText = counts.time;

        ['fly','time','out'].forEach(id => {
            const el = document.getElementById(`box-${id}`);
            const listArea = document.getElementById(`list-${id}`);
            if(counts[id] > 0) {
                el.style.display = "block";
                document.getElementById(`count-${id}`).innerText = counts[id];
                listArea.innerHTML = htmls[id] + '<div style="height:300px;"></div>' + htmls[id];
                listArea.style.animationDuration = (listArea.scrollHeight / 90) + "s";
            } else { el.style.display = "none"; }
        });
    });
</script>
</body>
</html>
