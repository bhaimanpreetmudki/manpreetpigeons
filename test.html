<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; text-transform: uppercase; margin: 0; padding: 0; }
        body { background: transparent; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; height: 100vh; color: white; }

        /* Result Screen Overlay */
        #result-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98); z-index: 5000;
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        .res-box { background: #FFD700; color: #000; padding: 50px; border-radius: 30px; border: 10px solid #fff; width: 85%; box-shadow: 0 0 50px #FFD700; }
        .res-title { font-size: 90px; font-weight: 950; margin-bottom: 30px; border-bottom: 5px solid #000; padding-bottom: 10px; }
        .res-details { font-size: 60px; font-weight: 800; line-height: 1.4; word-wrap: break-word; }

        /* Weather Box */
        #weather-box { position: absolute; bottom: 70px; left: 835px; width: 550px; height: 120px; display: none; overflow: hidden; z-index: 1001; }
        #weather-frame { width: 550px; height: 120px; border: none; pointer-events: none; transform: scale(1.5); transform-origin: top left; margin-top: -10px; margin-left: 5px; }

        /* Expiry Lock */
        #expiry-lock { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .lock-msg { background: #FFD700; color: #000; padding: 20px 40px; border-radius: 15px; border: 4px solid white; }

        /* Scoreboard Styling */
        .summary-wrapper { position: absolute; bottom: 95px; left: 15px; display: flex; gap: 15px; z-index: 1000; }
        .sum-card { display: flex; border-radius: 8px; overflow: hidden; border: 2px solid rgba(255,255,255,0.4); min-width: 260px; height: 75px; }
        .sum-label-area { background: rgba(0, 0, 0, 0.95); width: 65%; font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
        .sum-val-area { background: #fff; color: #000; width: 35%; font-size: 40px; font-weight: 950; display: flex; align-items: center; justify-content: center; }

        .flash-text::after { content: attr(data-pa); animation: langFlash 8s infinite; }
        @keyframes langFlash { 0%, 45% { content: attr(data-pa); } 50%, 95% { content: attr(data-en); } }

        .main-container { position: absolute; top: 10px; right: 20px; bottom: 85px; width: 400px; display: flex; flex-direction: column; gap: 10px; }
        .box { display: none; flex: 1; overflow: hidden; position: relative; border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 5px; }
        .box-header { height: 50px; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255,255,255,0.2); }
        #box-fly { background: rgba(0, 0, 100, 0.8); } #box-fly .box-header { background: #0000FF; }
        #box-time { background: rgba(180, 150, 0, 0.8); } #box-time .box-header { background: #FFD700; color: black; }
        #box-out { background: rgba(0, 0, 0, 0.8); } #box-out .box-header { background: #000000; }
        .header-title { font-size: 30px; font-weight: 950; }
        .count-tag { background: white; color: black; padding: 0 12px; border-radius: 4px; font-size: 30px; font-weight: 950; }

        .scroll-window { position: absolute; top: 50px; bottom: 0; width: 100%; overflow: hidden; }
        .list-area { position: absolute; width: 100%; animation: constantScroll linear infinite; will-change: transform; }
        .item { padding: 8px 25px; display: flex; align-items: center; gap: 15px; font-size: 40px; font-weight: 950; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .item-num { color: #FFD700; min-width: 50px; }
        @keyframes constantScroll { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }

        .footer { position: absolute; bottom: 0; width: 100%; height: 80px; background: #000; display: flex; align-items: center; border-top: 6px solid #FFD700; }
        .live-tag { background: #FFD700; color: #000; padding: 0 40px; height: 100%; display: flex; align-items: center; font-size: 55px; font-weight: 950; font-style: italic; }
        .ticker-wrap { flex: 1; overflow: hidden; white-space: nowrap; font-size: 35px; }
        .ticker-move { display: inline-block; padding-left: 100%; animation: ticker 65s linear infinite; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        .dt-box { background: #FFD700; height: 100%; padding: 0 35px; display: flex; align-items: center; width: 300px; min-width: 300px; }
        #dt-flash { font-size: 35px; font-weight: 950; color: #000; }
    </style>
</head>
<body>

<div id="result-screen">
    <div class="res-box">
        <div class="res-title" id="res-title">WINNER</div>
        <div class="res-details" id="res-details"></div>
    </div>
</div>

<div id="weather-box"><iframe id="weather-frame" src=""></iframe></div>
<div id="expiry-lock"><div class="lock-msg"><h1>PLAN EXPIRED</h1><p>ਮੈਨਪ੍ਰੀਤ ਸਿੰਘ ਮੁਦਕੀ: 86996-40061</p></div></div>

<div class="summary-wrapper" id="summary-div">
    <div class="sum-card"><div class="sum-label-area flash-text" data-pa="ਕੁੱਲ ਕਬੂਤਰ" data-en="TOTAL PIGEONS"></div><div id="m-total" class="sum-val-area">0</div></div>
    <div class="sum-card"><div class="sum-label-area flash-text" data-pa="ਬਾਕੀ ਕਬੂਤਰ" data-en="REMAINING"></div><div id="m-rem" class="sum-val-area">0</div></div>
    <div class="sum-card"><div class="sum-label-area flash-text" data-pa="ਸਮੇਂ ਚ ਕਬੂਤਰ" data-en="TIME PIGEONS"></div><div id="m-time" class="sum-val-area">0</div></div>
</div>

<div class="main-container" id="scoreboard-div">
    <div id="box-fly" class="box"><div class="box-header"><span class="header-title flash-text" data-pa="🕊️ ਉੱਡ ਰਹੇ" data-en="🕊️ FLYING"></span><span id="count-fly" class="count-tag">0</span></div><div class="scroll-window"><div class="list-area" id="list-fly"></div></div></div>
    <div id="box-time" class="box"><div class="box-header"><span class="header-title flash-text" data-pa="⏰ ਸਮੇਂ ਚ" data-en="⏰ TIME"></span><span id="box-time-val"></span><span id="count-time" class="count-tag">0</span></div><div class="scroll-window"><div class="list-area" id="list-time"></div></div></div>
    <div id="box-out" class="box"><div class="box-header"><span class="header-title flash-text" data-pa="❌ ਕੱਟੇ ਗਏ" data-en="❌ OUT"></span><span id="count-out" class="count-tag">0</span></div><div class="scroll-window"><div class="list-area" id="list-out"></div></div></div>
</div>

<div class="footer" id="ticker-div">
    <div class="live-tag">LIVE</div>
    <div class="ticker-wrap"><div id="ticker-text" class="ticker-move">WELCOME</div></div>
    <div class="dt-box"><div id="dt-flash">00:00:00 AM</div></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userID = new URLSearchParams(window.location.search).get('id');

    db.ref('users/' + userID).on('value', snap => {
        const data = snap.val(); if(!data) return;
        const conf = data.config || {}; const pigeons = data.pigeons || [];
        
        // Result Screen Logic
        const resOver = data.resultOverlay || {};
        const resScreen = document.getElementById('result-screen');
        if (resOver.active === true) {
            resScreen.style.display = 'flex';
            document.getElementById('res-title').innerText = resOver.title || "WINNER";
            document.getElementById('res-details').innerText = resOver.details || pigeons.filter(p => p.status === 'fly').map(p => p.name).join(", ");
        } else {
            resScreen.style.display = 'none';
        }

        // Scoreboard & Config
        document.getElementById('scoreboard-div').style.display = conf.showScoreboard ? "flex" : "none";
        document.getElementById('summary-div').style.display = conf.showScoreboard ? "flex" : "none";
        document.getElementById('ticker-text').innerText = conf.ticker || "";
        document.getElementById('box-time-val').innerText = conf.boxTime || "";

        let counts = { fly:0, out:0, time:0 }; let htmls = { fly:'', out:'', time:'' };
        pigeons.forEach((p, idx) => {
            let row = `<div class="item"><span class="item-num">${idx + 1}.</span><span>${p.name}</span></div>`;
            if (p.status === 'fly') { counts.fly++; htmls.fly += row; }
            else if (p.status === 'time') { counts.time++; htmls.time += row; }
            else if (p.status === 'out') { counts.out++; htmls.out += row; }
        });

        document.getElementById('m-total').innerText = pigeons.length;
        document.getElementById('m-rem').innerText = pigeons.length - counts.out;
        document.getElementById('m-time').innerText = counts.time;

        ['fly','time','out'].forEach(id => {
            const el = document.getElementById(`box-${id}`);
            const listArea = document.getElementById(`list-${id}`);
            if(counts[id] > 0) {
                el.style.display = "block";
                document.getElementById(`count-${id}`).innerText = counts[id];
                listArea.innerHTML = htmls[id] + '<div style="height:300px;"></div>' + htmls[id];
                listArea.style.animationDuration = (listArea.scrollHeight / 100) + "s";
            } else { el.style.display = "none"; }
        });
    });
</script>
</body>
</html>
