<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --header-h: 65px; --header-w: 40%; }
        * { box-sizing: border-box; text-transform: uppercase; margin: 0; padding: 0; }
        body { background: transparent; font-family: 'Segoe UI', 'Raavi', sans-serif; overflow: hidden; height: 100vh; }

        /* Weather Box */
        #weather-box {
            position: absolute; top: 20px; left: 10px; width: 550px; height: 120px; 
            display: none; overflow: hidden; background: transparent; z-index: 1001;
        }
        #weather-frame { 
            width: 550px; height: 120px; border: none; pointer-events: none;
            transform: scale(1.5); transform-origin: top left; margin-top: -10px; margin-left: 5px;
        }

        /* Animations */
        @keyframes sharpFlash {
            0% { filter: brightness(1); transform: scale(1) skewX(-15deg); opacity: 1; }
            50% { filter: brightness(10); transform: scale(1.2) skewX(-15deg); opacity: 1; }
            100% { filter: brightness(1); transform: scale(1) skewX(-15deg); opacity: 0; }
        }

        /* Result Overlay */
        #result-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 800px; background: rgba(0,0,0,0.9); border: 5px solid #f39c12;
            border-radius: 30px; display: none; z-index: 5000; padding: 30px; text-align: center;
            box-shadow: 0 0 50px rgba(243, 156, 18, 0.5);
        }
        .winner-title { color: #f39c12; font-size: 60px; font-weight: 1000; margin-bottom: 20px; border-bottom: 3px solid #fff; }
        .winner-item { color: #fff; font-size: 45px; font-weight: 800; margin: 10px 0; display: flex; justify-content: space-between; }

        /* Out Animation Style */
        #cut-anim-box {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) skewX(-15deg);
            background: red; color: white; padding: 20px 60px; font-size: 80px; font-weight: 1000;
            border: 8px solid white; display: none; z-index: 9999;
        }

        .main-container { 
            position: absolute; left: 10px; right: 10px; bottom: 80px; 
            height: 280px; display: flex; gap: 10px; justify-content: flex-start; 
        }
        
        .box { 
            display: none; width: 32.5%; height: 100%; position: relative; 
            border-radius: 25px; overflow: hidden; border: 4px solid #fff; 
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        #box-fly { background: rgba(0, 119, 255, 0.9) !important; }
        #box-out { background: rgba(200, 0, 0, 0.9) !important; }
        #box-time { background: rgba(204, 163, 0, 0.9) !important; }

        .header-wrapper { 
            position: absolute; top: 0; right: 0; width: var(--header-w); z-index: 10; 
            background: #000; border-bottom: 3px solid white; border-left: 3px solid white; 
            border-radius: 0 20px 0 20px; color: white;
        }
        .box-header, .sum-card { height: var(--header-h); display: flex; align-items: center; }
        .header-title { flex: 1; padding-left: 12px; font-weight: 900; font-size: 28px; border-right: 2px solid white; height: 100%; display: flex; align-items: center; }
        .count-tag, .sum-val-area { width: 35%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 1000; font-size: 34px; }
        .count-tag { background: #fff; color: #000; }
        .sum-val-area { background: #ffcc00; color: #000; border-bottom-right-radius: 15px; }

        .list-area { position: absolute; width: 100%; will-change: transform; display: flex; flex-direction: column; padding-top: calc(var(--header-h) * 2.3); }
        .item { padding: 5px 20px; font-size: 36px; font-weight: 1000; color: #fff; text-shadow: 2px 2px #000; }

        .footer { 
            position: absolute; bottom: 10px; left: 10px; width: calc(100% - 20px); height: 60px; 
            background: #fff; display: flex; align-items: center; border: 4px solid #000; border-radius: 15px; z-index: 20; overflow: hidden;
        }
        .live-tag { background: #ff0000; color: #fff; padding: 0 35px; height: 100%; display: flex; align-items: center; font-size: 30px; font-weight: 1000; transform: skewX(-25deg); margin-left: -25px; border-right: 5px solid #fff; z-index: 25; }
        .ticker-wrap { flex: 1; overflow: hidden; display: flex; align-items: center; }
        .ticker-move { display: flex; white-space: nowrap; font-size: 31px; font-weight: 1000; color: #000; }
        .dt-box-wrap { height: 100%; min-width: 350px; display: flex; align-items: center; justify-content: center; background: #ff0000; color: #fff; transform: skewX(-25deg); margin-right: -25px; border-left: 6px solid #fff; z-index: 25; }
        #clock-box { font-size: 30px; font-weight: 1000; transform: skewX(25deg); }
    </style>
</head>
<body>

<div id="cut-anim-box">OUT: NAME</div>

<div id="result-overlay">
    <div class="winner-title" id="win-title-lang">WINNERS / ਨਤੀਜਾ</div>
    <div id="winner-list-area"></div>
</div>

<div id="weather-box">
    <iframe id="weather-frame" src=""></iframe>
</div>

<div class="main-container" id="scoreboard-div">
    <div id="box-fly" class="box"><div class="box-inner">
        <div class="header-wrapper">
            <div class="box-header"><span class="header-title" id="title-fly">FLYING</span><span id="count-fly" class="count-tag">0</span></div>
            <div class="sum-card"><span class="header-title" id="total-fly">TOTAL</span><span id="m-total" class="sum-val-area">0</span></div>
        </div>
        <div style="height:100%; overflow:hidden;"><div class="list-area" id="list-fly"></div></div>
    </div></div>

    <div id="box-out" class="box"><div class="box-inner">
        <div class="header-wrapper">
            <div class="box-header"><span class="header-title" id="title-out">OUT</span><span id="count-out" class="count-tag">0</span></div>
            <div class="sum-card"><span class="header-title" id="rem-out">REM.</span><span id="m-rem" class="sum-val-area">0</span></div>
        </div>
        <div style="height:100%; overflow:hidden;"><div class="list-area" id="list-out"></div></div>
    </div></div>

    <div id="box-time" class="box"><div class="box-inner">
        <div class="header-wrapper">
            <div class="box-header"><span class="header-title" id="title-time">TIME</span><span id="count-time" class="count-tag">0</span></div>
            <div class="sum-card"><div id="m-time-val" class="sum-val-area" style="width: 100%; border-bottom-left-radius: 20px;">--</div></div>
        </div>
        <div style="height:100%; overflow:hidden;"><div class="list-area" id="list-time"></div></div>
    </div></div>
</div>

<div class="footer">
    <div class="live-tag"><span>LIVE</span></div>
    <div class="ticker-wrap"><div id="ticker-text" class="ticker-move"></div></div>
    <div class="dt-box-wrap"><div id="clock-box">--:--:--</div></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userID = new URLSearchParams(window.location.search).get('id');

    let langFlash = false, showDate = false, tickerPos = 0;
    let listPos = { fly: 0, time: 0, out: 0 };
    let lastCutTime = 0;
    let currentResData = null; // Global storage for toggles

    setInterval(() => {
        langFlash = !langFlash;
        document.getElementById('title-fly').innerText = langFlash ? "ਉੱਡ ਰਹੇ" : "FLYING";
        document.getElementById('total-fly').innerText = langFlash ? "ਕੁੱਲ" : "TOTAL";
        document.getElementById('title-out').innerText = langFlash ? "ਕੱਟੇ ਗਏ" : "OUT";
        document.getElementById('rem-out').innerText = langFlash ? "ਬਾਕੀ" : "REM.";
        document.getElementById('title-time').innerText = langFlash ? "ਸਮੇਂ ਚ" : "TIME";
        
        // Handle Result Title Toggle
        const winTitle = document.getElementById('win-title-lang');
        if(currentResData && currentResData.active) {
            if(currentResData.isShared) {
                winTitle.innerText = langFlash ? "ਬਾਜੀ ਸਾਂਝੀ" : "BAJI SANJHI";
            } else {
                winTitle.innerText = langFlash ? "ਅੰਤਿਮ ਨਤੀਜਾ" : "FINAL RESULT";
            }
        }
    }, 3000);

    setInterval(() => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const dateStr = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()}`;
        document.getElementById('clock-box').innerText = showDate ? dateStr : timeStr;
    }, 1000);

    setInterval(() => { showDate = !showDate; }, 15000);

    if(userID) {
        db.ref('users/' + userID).on('value', snap => {
            const data = snap.val(); if(!data) return;
            const pigeons = data.pigeons || [];
            const conf = data.config || {};
            const resData = data.resultOverlay || {};
            currentResData = resData; // Update global
            
            const scoreDiv = document.getElementById('scoreboard-div');
            
            // Scoreboard hide logic
            if (resData.active) {
                scoreDiv.style.display = "none";
            } else {
                scoreDiv.style.display = conf.showScoreboard !== false ? "flex" : "none";
            }

            document.querySelector('.footer').style.display = conf.showTicker !== false ? "flex" : "none";
            document.getElementById('m-time-val').innerText = conf.boxTime || "--";

            // Weather Logic
            const wBox = document.getElementById('weather-box');
            if(conf.showWeather && !resData.active) {
                wBox.style.display = "block";
                const wUrl = `https://maxpunjab.com/weather/overlay.php?lat=${conf.lat || "30.598"}&lon=${conf.lon || "74.738"}&name=${encodeURIComponent(conf.pindName || "")}`;
                if(document.getElementById('weather-frame').src !== wUrl) document.getElementById('weather-frame').src = wUrl;
            } else { wBox.style.display = "none"; }

            // Ticker Logic
            const tickerElem = document.getElementById('ticker-text');
            const txt = conf.ticker || "";
            tickerElem.innerHTML = `<div class="ticker-content" style="padding-right:800px">${txt}</div><div class="ticker-content" style="padding-right:800px">${txt}</div>`;

            // List Processing
            let htmlArr = { fly:[], out:[], time:[] };
            pigeons.forEach((p, idx) => {
                let row = `<div class="item">${idx + 1}. ${p.name}</div>`;
                if(htmlArr[p.status]) htmlArr[p.status].push(row);
            });

            document.getElementById('m-total').innerText = pigeons.length;
            document.getElementById('m-rem').innerText = pigeons.length - htmlArr.out.length;

            ['fly','time','out'].forEach(id => {
                const area = document.getElementById(`list-${id}`);
                const box = document.getElementById(`box-${id}`);
                if(htmlArr[id].length > 0 && conf.showScoreboard !== false && !resData.active) {
                    box.style.display = "block";
                    document.getElementById(`count-${id}`).innerText = htmlArr[id].length;
                    const content = htmlArr[id].join('');
                    area.innerHTML = `<div class="block">${content}</div><div style="height:350px"></div><div class="block">${content}</div>`;
                } else { box.style.display = "none"; }
            });

            // Out Anim
            if(data.cutAnimation && data.cutAnimation.time > lastCutTime) {
                lastCutTime = data.cutAnimation.time;
                const animBox = document.getElementById('cut-anim-box');
                animBox.innerText = `OUT: ${data.cutAnimation.name}`;
                animBox.style.display = "block";
                animBox.style.animation = "sharpFlash 4s forwards";
                setTimeout(() => { animBox.style.display = "none"; animBox.style.animation = ""; }, 4000);
            }

            // Result/Shared Box Logic
            const resBox = document.getElementById('result-overlay');
            const resListArea = document.getElementById('winner-list-area');
            if(resData.active) {
                resBox.style.display = "block";
                if(resData.isShared) {
                    resListArea.innerHTML = `<div class="winner-item" style="justify-content: center; font-size: 80px; color: #2ecc71; width: 100%;">OK</div>`;
                } else {
                    let winHtml = "";
                    (resData.names || []).forEach((name, i) => {
                        winHtml += `<div class="winner-item"><span>${i+1}. ${name}</span> <span>🏆</span></div>`;
                    });
                    resListArea.innerHTML = winHtml;
                }
            } else { 
                resBox.style.display = "none"; 
            }
        });
    }

    function animate() {
        ['fly', 'time', 'out'].forEach(id => {
            const area = document.getElementById(`list-${id}`);
            if (area && area.parentElement.parentElement.style.display !== "none") {
                listPos[id] -= 1.2;
                let block = area.querySelector('.block');
                if(block) {
                    let resetPoint = block.offsetHeight + 350;
                    if (Math.abs(listPos[id]) >= resetPoint) listPos[id] = 0;
                    area.style.transform = `translateY(${listPos[id]}px)`;
                }
            }
        });
        tickerPos -= 2.0;
        const tMove = document.getElementById('ticker-text');
        if(tMove && Math.abs(tickerPos) >= tMove.scrollWidth / 2) tickerPos = 0;
        if(tMove) tMove.style.transform = `translateX(${tickerPos}px)`;
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
