<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { 
            --header-h: 65px; 
            --header-w: 40%; 
        }
        * { box-sizing: border-box; text-transform: uppercase; margin: 0; padding: 0; }
        body { background: transparent; font-family: 'Segoe UI', 'Raavi', sans-serif; overflow: hidden; height: 100vh; }

        /* --- New Result Box Style --- */
        #result-overlay-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 800px; background: rgba(0, 0, 0, 0.95); border: 8px solid #f39c12;
            border-radius: 40px; color: white; display: none; z-index: 9999;
            box-shadow: 0 0 50px rgba(243, 156, 18, 0.5); padding: 40px; text-align: center;
        }
        .res-head { font-size: 50px; color: #f39c12; font-weight: 900; border-bottom: 4px solid #fff; margin-bottom: 20px; padding-bottom: 10px; }
        .res-list { list-style: none; font-size: 42px; font-weight: 800; line-height: 1.5; }
        .res-list li { padding: 10px; border-bottom: 1px dashed #444; }

        /* --- Cut Animation Flash --- */
        #cut-anim {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: red; color: white; padding: 20px 60px; font-size: 60px; font-weight: 900;
            border: 10px solid white; border-radius: 20px; display: none; z-index: 10000;
            animation: zoomInOut 0.5s infinite alternate;
        }
        @keyframes zoomInOut { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.2); } }

        /* Existing Styles ... */
        #weather-box { position: absolute; top: 20px; left: 10px; width: 550px; height: 120px; display: none; overflow: hidden; z-index: 1001; }
        #weather-frame { width: 550px; height: 120px; border: none; transform: scale(1.5); transform-origin: top left; }
        
        .main-container { position: absolute; left: 10px; right: 10px; bottom: 80px; height: 320px; display: flex; gap: 10px; }
        .box { display: none; width: 32.5%; height: 100%; position: relative; border-radius: 25px; overflow: hidden; border: 4px solid #fff; }
        #box-fly { background: rgba(0, 191, 255, 0.85) !important; }
        #box-out { background: rgba(255, 0, 0, 0.85) !important; }
        #box-time { background: rgba(255, 255, 0, 0.85) !important; }

        .header-wrapper { position: absolute; top: 0; right: 0; width: var(--header-w); z-index: 10; background: #000; border-bottom: 3px solid white; border-left: 3px solid white; border-radius: 0 20px 0 20px; color: white; }
        .box-header, .sum-card { height: var(--header-h); display: flex; align-items: center; }
        .header-title { flex: 1; padding-left: 12px; font-weight: 900; font-size: 28px; border-right: 2px solid white; height: 100%; display: flex; align-items: center; }
        .count-tag, .sum-val-area { width: 35%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 1000; font-size: 34px; }
        .count-tag { background: #fff; color: #000; }
        .sum-val-area { background: #ffcc00; color: #000; }

        .list-area { position: absolute; width: 100%; display: flex; flex-direction: column; padding-top: calc(var(--header-h) * 2.3); }
        .item { padding: 5px 20px; font-size: 36px; font-weight: 1000; line-height: 1.1; color: #000; }
        #box-out .item { color: #fff; }

        .footer { position: absolute; bottom: 5px; left: 10px; width: calc(100% - 20px); height: 65px; background: #fff; display: flex; align-items: center; border: 4px solid #000; border-radius: 15px; z-index: 20; overflow: hidden; }
        .live-tag { background: #ff0000; color: #fff; padding: 0 35px; height: 100%; display: flex; align-items: center; font-size: 30px; font-weight: 1000; transform: skewX(-25deg); margin-left: -25px; border-right: 5px solid #fff; }
        .ticker-wrap { flex: 1; overflow: hidden; }
        .ticker-move { display: flex; white-space: nowrap; font-size: 34px; font-weight: 1000; color: #000; }
        .dt-box-wrap { height: 100%; min-width: 380px; display: flex; align-items: center; justify-content: center; background: #ff0000; color: #fff; transform: skewX(-25deg); margin-right: -25px; border-left: 6px solid #fff; }
        #clock-box { font-size: 32px; font-weight: 1000; transform: skewX(25deg); }
    </style>
</head>
<body>

<!-- Result Popup -->
<div id="result-overlay-box">
    <div id="res-title" class="res-head">RESULT</div>
    <ul id="res-list-items" class="res-list"></ul>
</div>

<!-- Cut Animation -->
<div id="cut-anim">OUT: <span id="cut-name">---</span></div>

<div id="weather-box"><iframe id="weather-frame" src=""></iframe></div>

<div class="main-container" id="scoreboard-div">
    <div id="box-fly" class="box"><div class="box-inner">
        <div class="header-wrapper">
            <div class="box-header"><span class="header-title" id="title-fly">FLYING</span><span id="count-fly" class="count-tag">0</span></div>
            <div class="sum-card"><span class="header-title" id="total-fly">TOTAL</span><span id="m-total" class="sum-val-area">0</span></div>
        </div>
        <div class="scroll-window"><div class="list-area" id="list-fly"></div></div>
    </div></div>

    <div id="box-out" class="box"><div class="box-inner">
        <div class="header-wrapper">
            <div class="box-header"><span class="header-title" id="title-out">OUT</span><span id="count-out" class="count-tag">0</span></div>
            <div class="sum-card"><span class="header-title" id="rem-out">REM.</span><span id="m-rem" class="sum-val-area">0</span></div>
        </div>
        <div class="scroll-window"><div class="list-area" id="list-out"></div></div>
    </div></div>

    <div id="box-time" class="box"><div class="box-inner">
        <div class="header-wrapper">
            <div class="box-header"><span class="header-title" id="title-time">TIME</span><span id="count-time" class="count-tag">0</span></div>
            <div class="sum-card"><div id="m-time-val" class="sum-val-area" style="width: 100%;">--</div></div>
        </div>
        <div class="scroll-window"><div class="list-area" id="list-time"></div></div>
    </div></div>
</div>

<div class="footer">
    <div class="live-tag"><span>LIVE</span></div>
    <div class="ticker-wrap"><div id="ticker-text" class="ticker-move"></div></div>
    <div class="dt-box-wrap"><div id="clock-box">--:--:--</div></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userID = new URLSearchParams(window.location.search).get('id');

    let listPos = { fly: 0, time: 0, out: 0 };
    let tickerPos = 0;
    let showDate = false;

    if(userID) {
        // --- 1. Listen for Result Overlay ---
        db.ref('users/' + userID + '/resultOverlay').on('value', snap => {
            const res = snap.val();
            const resBox = document.getElementById('result-overlay-box');
            if(res && res.active) {
                document.getElementById('res-title').innerText = res.type === 'winners' ? "TODAY'S WINNERS" : "BAJI SHARED";
                let listHtml = "";
                res.names.forEach((n, i) => { listHtml += `<li>${i+1}. ${n}</li>`; });
                document.getElementById('res-list-items').innerHTML = listHtml;
                resBox.style.display = "block";
            } else {
                resBox.style.display = "none";
            }
        });

        // --- 2. Listen for Cut Animation ---
        db.ref('users/' + userID + '/cutAnimation').on('value', snap => {
            const anim = snap.val();
            if(anim && anim.name) {
                const animDiv = document.getElementById('cut-anim');
                document.getElementById('cut-name').innerText = anim.name;
                animDiv.style.display = "block";
                setTimeout(() => { animDiv.style.display = "none"; }, 5000);
            }
        });

        // --- 3. Main Data Update ---
        db.ref('users/' + userID).on('value', snap => {
            const data = snap.val(); if(!data) return;
            const pigeons = data.pigeons || [];
            const conf = data.config || {};

            // Scoreboard & Ticker Visibility
            document.getElementById('scoreboard-div').style.display = conf.showScoreboard ? "flex" : "none";
            document.querySelector('.footer').style.display = conf.showTicker ? "flex" : "none";
            document.getElementById('m-time-val').innerText = conf.boxTime || "--";

            // Ticker Update
            const tickerElem = document.getElementById('ticker-text');
            const txt = conf.ticker || "";
            tickerElem.innerHTML = `<div class="ticker-content">${txt} &nbsp;&nbsp;&nbsp;</div><div class="ticker-content">${txt} &nbsp;&nbsp;&nbsp;</div>`;

            // List Update
            let htmlArr = { fly:[], out:[], time:[] };
            pigeons.forEach((p, idx) => {
                let row = `<div class="item">${idx + 1}. ${p.name}</div>`;
                if (htmlArr[p.status]) htmlArr[p.status].push(row);
            });

            document.getElementById('m-total').innerText = pigeons.length;
            document.getElementById('m-rem').innerText = pigeons.length - htmlArr.out.length;

            ['fly','time','out'].forEach(id => {
                const area = document.getElementById(`list-${id}`);
                const box = document.getElementById(`box-${id}`);
                if(htmlArr[id].length > 0 && conf.showScoreboard) {
                    box.style.display = "block";
                    document.getElementById(`count-${id}`).innerText = htmlArr[id].length;
                    const content = htmlArr[id].join('');
                    area.innerHTML = `<div class="content-block">${content}</div><div style="height:350px"></div><div class="content-block">${content}</div>`;
                } else { box.style.display = "none"; }
            });
        });
    }

    // Time & Date Logic
    setInterval(() => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const dateStr = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()}`;
        document.getElementById('clock-box').innerText = showDate ? dateStr : timeStr;
    }, 1000);

    setInterval(() => { showDate = !showDate; }, 10000);

    function animate() {
        ['fly', 'time', 'out'].forEach(id => {
            const area = document.getElementById(`list-${id}`);
            const box = document.getElementById(`box-${id}`);
            if (area && box && box.style.display !== "none") {
                listPos[id] -= 1.0;
                let firstBlock = area.querySelector('.content-block');
                if(firstBlock) {
                    if (Math.abs(listPos[id]) >= firstBlock.offsetHeight + 350) listPos[id] = 0;
                    area.style.transform = `translateY(${listPos[id]}px)`;
                }
            }
        });
        const tMove = document.getElementById('ticker-text');
        if (tMove) {
            tickerPos -= 1.5;
            if (Math.abs(tickerPos) >= tMove.scrollWidth / 2) tickerPos = 0;
            tMove.style.transform = `translateX(${tickerPos}px)`;
        }
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
