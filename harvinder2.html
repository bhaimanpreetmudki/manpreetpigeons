<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --header-h: 65px; --header-w: 40%; }
        * { box-sizing: border-box; text-transform: uppercase; margin: 0; padding: 0; }
        body { background: transparent; font-family: 'Segoe UI', 'Raavi', sans-serif; overflow: hidden; height: 100vh; }

        #result-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 950px; background: rgba(0,0,0,0.98); border: 8px solid #f39c12;
            border-radius: 40px; display: none; z-index: 5000; padding: 40px; text-align: center;
            box-shadow: 0 0 70px rgba(243, 156, 18, 0.7);
        }
        .winner-title { color: #f39c12; font-size: 70px; font-weight: 1000; margin-bottom: 25px; border-bottom: 4px solid #fff; padding-bottom: 10px; }
        
        /* Scrolling Area for Result */
        #winner-list-area { max-height: 550px; overflow: hidden; position: relative; }
        .res-mover { display: flex; flex-direction: column; transition: transform 0.1s linear; }
        
        .winner-item { color: #fff; font-size: 52px; font-weight: 900; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; border-bottom: 1px solid rgba(255,255,255,0.1); }

        .main-container { position: absolute; left: 15px; right: 15px; bottom: 85px; height: 280px; display: flex; gap: 12px; }
        .box { display: none; width: 32.5%; height: 100%; position: relative; border-radius: 25px; border: 4px solid #fff; overflow: hidden; }
        #box-fly { background: rgba(0, 110, 255, 0.95); }
        #box-out { background: rgba(220, 0, 0, 0.95); }
        #box-time { background: rgba(210, 160, 0, 0.95); }

        .header-wrapper { position: absolute; top: 0; right: 0; width: var(--header-w); background: #000; border-bottom: 3px solid #fff; border-left: 3px solid #fff; border-radius: 0 20px 0 20px; color: #fff; }
        .box-header { height: var(--header-h); display: flex; align-items: center; }
        .header-title { flex: 1; padding-left: 12px; font-weight: 900; font-size: 28px; }
        .count-tag { width: 35%; background: #fff; color: #000; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 1000; font-size: 34px; }
        
        .list-area { padding-top: 80px; }
        .item { padding: 6px 22px; font-size: 38px; font-weight: 1000; color: #fff; }
    </style>
</head>
<body>

<div id="result-overlay">
    <div class="winner-title" id="win-title">RESULT</div>
    <div id="winner-list-area">
        <div id="res-scroll-content" class="res-mover"></div>
    </div>
</div>

<div class="main-container" id="scoreboard-div">
    <div id="box-fly" class="box"><div class="header-wrapper"><div class="box-header"><span class="header-title">FLYING</span><span id="count-fly" class="count-tag">0</span></div></div><div class="list-area" id="list-fly"></div></div>
    <div id="box-out" class="box"><div class="header-wrapper"><div class="box-header"><span class="header-title">OUT</span><span id="count-out" class="count-tag">0</span></div></div><div class="list-area" id="list-out"></div></div>
    <div id="box-time" class="box"><div class="header-wrapper"><div class="box-header"><span class="header-title">TIME</span><span id="count-time" class="count-tag">0</span></div></div><div class="list-area" id="list-time"></div></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetpigeons-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userID = new URLSearchParams(window.location.search).get('id');

    let currentResData = null;
    let langFlash = false;
    let resScrollPos = 0;

    const positionsPB = ["ਪਹਿਲਾ", "ਦੂਜਾ", "ਤੀਜਾ", "ਚੌਥਾ", "ਪੰਜਵਾਂ", "ਛੇਵਾਂ", "ਸੱਤਵਾਂ", "ਅੱਠਵਾਂ", "ਨੌਵਾਂ", "ਦਸਵਾਂ"];
    const positionsEN = ["1ST", "2ND", "3RD", "4TH", "5TH", "6TH", "7TH", "8TH", "9TH", "10TH"];

    function updateDisplay() {
        if(!currentResData || !currentResData.active) return;
        
        const winTitleElem = document.getElementById('win-title');
        const resContent = document.getElementById('res-scroll-content');
        const names = currentResData.names || [];
        
        // BAJI SHARED ਚੈੱਕ ਕਰੋ
        const rawTitle = (currentResData.title || "").toUpperCase();
        const isShared = rawTitle.includes("SHARED") || rawTitle.includes("ਸਾਂਝੀ") || currentResData.isShared === true;

        if(isShared) {
            winTitleElem.innerText = langFlash ? "BAJI SHARED" : "ਬਾਜੀ ਸਾਂਝੀ";
        } else {
            winTitleElem.innerText = langFlash ? "FINAL RESULT" : "ਅੰਤਿਮ ਨਤੀਜਾ";
        }

        let html = "";
        names.forEach((name, i) => {
            if(isShared) {
                html += `<div class="winner-item"><span>${i+1}. ${name}</span> <span>🤝</span></div>`;
            } else {
                let pos = langFlash ? positionsEN[i] || (i+1) : positionsPB[i] || (i+1);
                html += `<div class="winner-item"><span>${pos}: ${name}</span> <span>🏆</span></div>`;
            }
        });

        // ਜੇਕਰ 6 ਤੋਂ ਵੱਧ ਟੀਮਾਂ ਹਨ ਤਾਂ ਲਿਸਟ ਡਬਲ ਕਰੋ (Scrolling ਲਈ)
        if(names.length > 6) {
            resContent.innerHTML = `<div class="res-block">${html}</div><div style="height:100px"></div><div class="res-block">${html}</div>`;
        } else {
            resContent.innerHTML = `<div class="res-block">${html}</div>`;
            resScrollPos = 0;
            resContent.style.transform = `translateY(0px)`;
        }
    }

    // Scrolling ਐਨੀਮੇਸ਼ਨ
    function animateResult() {
        const resContent = document.getElementById('res-scroll-content');
        const namesCount = currentResData ? (currentResData.names || []).length : 0;

        if (currentResData && currentResData.active && namesCount > 6) {
            resScrollPos -= 1.2;
            const firstBlock = resContent.querySelector('.res-block');
            if (firstBlock) {
                const limit = firstBlock.offsetHeight + 100;
                if (Math.abs(resScrollPos) >= limit) resScrollPos = 0;
                resContent.style.transform = `translateY(${resScrollPos}px)`;
            }
        }
        requestAnimationFrame(animateResult);
    }
    animateResult();

    setInterval(() => {
        langFlash = !langFlash;
        updateDisplay();
    }, 3000);

    if(userID) {
        db.ref('users/' + userID).on('value', snap => {
            const data = snap.val();
            if(!data) return;
            
            currentResData = data.resultOverlay || {};
            const resBox = document.getElementById('result-overlay');
            const scoreDiv = document.getElementById('scoreboard-div');

            if(currentResData.active) {
                resBox.style.display = "block";
                scoreDiv.style.display = "none";
                resScrollPos = 0; // ਰੀਸੈੱਟ ਸਕ੍ਰੋਲ
                updateDisplay();
            } else {
                resBox.style.display = "none";
                scoreDiv.style.display = "flex";
                
                const pigeons = data.pigeons || [];
                let lists = { fly:[], out:[], time:[] };
                pigeons.forEach((p, i) => {
                    if(lists[p.status]) lists[p.status].push(`<div class="item">${i+1}. ${p.name}</div>`);
                });
                ['fly','out','time'].forEach(id => {
                    document.getElementById(`box-${id}`).style.display = lists[id].length ? "block" : "none";
                    document.getElementById(`count-${id}`).innerText = lists[id].length;
                    document.getElementById(`list-${id}`).innerHTML = lists[id].join('');
                });
            }
        });
    }
</script>
</body>
</html>
