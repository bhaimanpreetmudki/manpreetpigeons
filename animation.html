<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Panel - Manpreet Mudki</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

body{
    font-family:'Segoe UI',sans-serif;
    background:#0f1113;
    color:white;
    margin:0;
    padding:10px;
    text-transform:uppercase;
}

.top-mini-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1a1d21;
    padding:8px 12px;
    border-radius:8px;
    margin-bottom:15px;
    border:1px solid #333;
    font-size:11px;
}

.top-mini-bar b{
    color:#f39c12;
}

.controls-container{
    background:#1a1d21;
    padding:15px;
    border-radius:12px;
    border:1px solid #333;
    margin-bottom:15px;
}

textarea,input{
    width:100%;
    padding:12px;
    background:#0d1117;
    border:1px solid #444;
    color:white;
    border-radius:8px;
    font-size:14px;
    outline:none;
    box-sizing:border-box;
    margin-bottom:10px;
    text-transform:uppercase;
}

.btn-add{
    background:#f39c12;
    color:black;
    border:none;
    padding:12px;
    border-radius:8px;
    font-weight:900;
    cursor:pointer;
    width:100%;
    margin-bottom:10px;
}

.btn-update{
    background:#238636;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    font-weight:900;
    cursor:pointer;
    width:100%;
}

.display-controls-box{
    background:#1a1d21;
    padding:10px;
    border-radius:10px;
    border:1px solid #444;
    margin-bottom:15px;
}

.btn-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
}

.toggle-btn{
    flex:1;
    min-width:100px;
    padding:10px;
    border:none;
    border-radius:6px;
    font-weight:900;
    font-size:11px;
    cursor:pointer;
    color:white;
}

.btn-reset{
    width:100%;
    padding:10px;
    background:transparent;
    color:#ff4d4d;
    border:1px solid #ff4d4d;
    border-radius:8px;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.admin-sum-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:10px;
    background:#1a1d21;
    padding:12px;
    border-radius:12px;
    border:1px solid #333;
    border-bottom:3px solid #f39c12;
}

.sum-item{
    text-align:center;
    font-size:10px;
    color:#aaa;
}

.sum-item b{
    font-size:20px;
    color:#f39c12;
    display:block;
}

.section-title{
    font-size:14px;
    font-weight:900;
    margin:15px 0 8px 0;
    padding-left:5px;
    border-left:4px solid #f39c12;
    color:#fff;
}

.pigeon-row{
    background:#21262d;
    padding:10px;
    border-radius:10px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    border:1px solid #30363d;
}

.cut-row{
    background:#2a1f21;
    border:1px solid #4a282b;
}

.name-part{
    flex-grow:1;
    display:flex;
    align-items:center;
}

.edit-name-box{
    background:transparent;
    border:1px solid #444;
    color:#f39c12;
    padding:5px;
    border-radius:6px;
    font-size:13px;
    font-weight:bold;
    width:85%;
    margin-left:5px;
    outline:none;
}

.btn-part{
    display:flex;
    gap:5px;
    align-items:center;
}

.st-btn{
    border:none;
    padding:8px 10px;
    border-radius:5px;
    font-weight:900;
    color:white;
    opacity:.35;
    font-size:11px;
    cursor:pointer;
    min-width:55px;
}

.st-btn.active{
    opacity:1;
    border:1px solid white;
    box-shadow:0 0 8px rgba(255,255,255,0.2);
}

.cut-section{
    background:rgba(231,76,60,.05);
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(231,76,60,.3);
    margin-top:15px;
}

.login-box{
    max-width:350px;
    margin:80px auto;
    text-align:center;
    background:#1a1d21;
    padding:25px;
    border-radius:15px;
    border:1px solid #333;
}

.pos-input{
    width:35px;
    background:#0d1117;
    border:1px solid #444;
    color:#f39c12;
    font-size:11px;
    text-align:center;
    border-radius:4px;
    padding:4px;
}

/* 🔥 CUT FLASH OVERLAY */

#cutOverlay{
    position:fixed;
    inset:0;
    z-index:999999;
    pointer-events:none;
    opacity:0;
}

#cutOverlay.active{
    animation:cutFlash .8s ease;
}

@keyframes cutFlash{

    0%{
        opacity:0;
        background:black;
        transform:scale(1);
    }

    10%{
        opacity:1;
        background:white;
        transform:scale(1.02);
    }

    25%{
        opacity:1;
        background:red;
    }

    40%{
        opacity:1;
        background:white;
    }

    60%{
        opacity:.8;
        background:red;
    }

    100%{
        opacity:0;
        background:black;
    }
}

</style>
</head>

<body>

<!-- 🔥 FLASH OVERLAY -->
<div id="cutOverlay"></div>

<div id="login-box" class="login-box">

    <h2 style="color:#f39c12;">ADMIN LOGIN</h2>

    <input type="password" id="adminPass" placeholder="PASSWORD">

    <button onclick="checkLogin()" class="btn-add">
        ENTER CONTROL
    </button>

</div>

<div id="main-content" style="display:none;">

    <div class="top-mini-bar">
        <span>HELP: <b>+91 8699640061</b></span>
        <span>EXPIRY: <b id="expDisp">--</b></span>
    </div>

    <div class="controls-container">

        <textarea id="pName" placeholder="TEAM NAMES"></textarea>

        <button class="btn-add" onclick="addP()">
            ADD LIST
        </button>

        <button class="btn-update" onclick="manualUpdate()">
            UPDATE DATA
        </button>

    </div>

    <div class="admin-sum-grid">

        <div class="sum-item">
            TOTAL
            <b id="sum-total">0</b>
        </div>

        <div class="sum-item">
            FLY
            <b id="sum-fly" style="color:#3498db;">0</b>
        </div>

        <div class="sum-item">
            TIME
            <b id="sum-time" style="color:#f1c40f;">0</b>
        </div>

        <div class="sum-item">
            OUT
            <b id="sum-out" style="color:#e74c3c;">0</b>
        </div>

    </div>

    <div class="section-title">
        ACTIVE TOURNAMENT LIST
    </div>

    <div id="listArea"></div>

    <div class="cut-section">

        <div class="section-title" style="color:#e74c3c;border-left-color:#e74c3c;">
            CUT LIST
        </div>

        <div id="cutListArea"></div>

    </div>

</div>

<script>

const firebaseConfig = {
    databaseURL:"https://manpreetpigeons-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const urlParams = new URLSearchParams(window.location.search);

const userID = urlParams.get('id');

let localData = {
    pigeons:[]
};

function checkLogin(){

    if(!userID){
        alert("ID MISSING");
        return;
    }

    db.ref('users/' + userID).once('value', snap => {

        const data = snap.val();

        if(data && data.password.toString() === document.getElementById('adminPass').value){

            document.getElementById('login-box').style.display="none";

            document.getElementById('main-content').style.display="block";

            document.getElementById('expDisp').innerText=data.expiry || "31-12-2026";

            db.ref('users/' + userID).on('value', s => {

                if(s.val()){

                    localData=s.val();

                    render();

                }

            });

        }else{

            alert("WRONG PASSWORD");

        }

    });

}

function render(){

    const mainList=document.getElementById('listArea');

    const cutList=document.getElementById('cutListArea');

    mainList.innerHTML="";
    cutList.innerHTML="";

    let c={
        fly:0,
        time:0,
        out:0
    };

    const pList=localData.pigeons || [];

    pList.forEach((p,idx)=>{

        if(p.status==='fly') c.fly++;
        else if(p.status==='time') c.time++;
        else c.out++;

        let row=`

        <div class="pigeon-row ${p.status==='out'?'cut-row':''}">

            <div class="name-part">

                <input type="number"
                    class="pos-input"
                    value="${idx+1}"
                    onkeydown="if(event.key==='Enter') movePosition('${p.id}', this.value)">

                <input type="text"
                    class="edit-name-box"
                    value="${p.name}"
                    onblur="updateName('${p.id}', this.value)">

            </div>

            <div class="btn-part">

                <button class="st-btn ${p.status=='fly'?'active':''}"
                    style="background:#3498db"
                    onclick="setStatus('${p.id}','fly')">
                    FLY
                </button>

                <button class="st-btn ${p.status=='time'?'active':''}"
                    style="background:#f1c40f"
                    onclick="setStatus('${p.id}','time')">
                    TIME
                </button>

                <button class="st-btn ${p.status=='out'?'active':''}"
                    style="background:#e74c3c"
                    onclick="setStatus('${p.id}','out')">
                    OUT
                </button>

                <button onclick="delP('${p.id}')"
                    style="background:none;border:none;color:#ff4d4d;font-size:18px;cursor:pointer;">
                    ×
                </button>

            </div>

        </div>
        `;

        if(p.status==='out'){
            cutList.innerHTML += row;
        }else{
            mainList.innerHTML += row;
        }

    });

    document.getElementById('sum-total').innerText=pList.length;
    document.getElementById('sum-fly').innerText=c.fly;
    document.getElementById('sum-time').innerText=c.time;
    document.getElementById('sum-out').innerText=c.out;

}

function syncPigeons(){

    db.ref('users/' + userID + '/pigeons').set(localData.pigeons || []);

}

function addP(){

    const names=document.getElementById('pName').value
    .split(',')
    .map(n=>n.trim().toUpperCase())
    .filter(n=>n!="");

    if(!localData.pigeons){
        localData.pigeons=[];
    }

    names.forEach(n=>{

        localData.pigeons.push({
            id:"id_" + Date.now() + Math.random(),
            name:n,
            status:'fly'
        });

    });

    document.getElementById('pName').value="";

    syncPigeons();

}

function updateName(id,newName){

    localData.pigeons = localData.pigeons.map(p =>
        p.id==id ? {...p,name:newName.toUpperCase()} : p
    );

    syncPigeons();

}

function movePosition(id,newPos){

    newPos=parseInt(newPos);

    let pList=[...localData.pigeons];

    if(isNaN(newPos) || newPos<1 || newPos>pList.length){
        render();
        return;
    }

    const oldIndex=pList.findIndex(p=>p.id===id);

    if(oldIndex!==-1){

        const [movedItem]=pList.splice(oldIndex,1);

        pList.splice(newPos-1,0,movedItem);

        db.ref('users/' + userID + '/pigeons').set(pList);

    }

}

/* 🔥 MAIN CUT FUNCTION */

function setStatus(id,s){

    const oldPigeon = localData.pigeons.find(p => p.id == id);

    localData.pigeons = localData.pigeons.map(p =>
        p.id == id ? {...p,status:s} : p
    );

    syncPigeons();

    // 🔥 FLASH ONLY WHEN CUT
    if(oldPigeon && oldPigeon.status !== 'out' && s === 'out'){

        db.ref('users/' + userID + '/cutAnimation').set({
            time:Date.now(),
            pigeon:oldPigeon.name
        });

    }

}

function delP(id){

    if(confirm("DELETE?")){

        localData.pigeons = localData.pigeons.filter(p => p.id != id);

        syncPigeons();

    }

}

function manualUpdate(){

    alert("UPDATED");

}

/* 🔥 CUT ANIMATION LISTENER */

db.ref('users/' + userID + '/cutAnimation').on('value', snap => {

    const data=snap.val();

    if(!data) return;

    const overlay=document.getElementById('cutOverlay');

    overlay.classList.remove('active');

    void overlay.offsetWidth;

    overlay.classList.add('active');

    // 🔊 SOUND
    const audio = new Audio(
        'https://actions.google.com/sounds/v1/alarms/beep_short.ogg'
    );

    audio.volume=0.8;

    audio.play().catch(()=>{});

});

</script>

</body>
</html>
