<!-- 🔥 FULL CUT OVERLAY SYSTEM (SINGLE CODE) -->

<div id="cutOverlay"></div>

<style>
#cutOverlay{
    position:fixed;
    inset:0;
    z-index:999999;
    pointer-events:none;
    opacity:0;
}

#cutOverlay.active{
    animation: cutFlash 0.8s ease;
}

@keyframes cutFlash{

    0%{
        opacity:0;
        background:black;
        transform:scale(1);
    }

    10%{
        opacity:1;
        background:white;
        transform:scale(1.02);
    }

    25%{
        opacity:1;
        background:red;
        transform:scale(1);
    }

    40%{
        opacity:1;
        background:white;
    }

    60%{
        opacity:0.8;
        background:red;
        transform:scale(1.01);
    }

    100%{
        opacity:0;
        background:black;
        transform:scale(1);
    }
}
</style>

<script>
// 🔥 FIREBASE CUT LISTENER
db.ref('users/' + userID + '/cutAnimation').on('value', snap => {
    const data = snap.val();
    if(!data) return;

    const overlay = document.getElementById('cutOverlay');

    // restart animation every update
    overlay.classList.remove('active');
    void overlay.offsetWidth; // reset trick
    overlay.classList.add('active');

    // optional sound effect
    const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
    audio.volume = 0.8;
    audio.play();
});
</script>
