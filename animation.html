<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBS CUT FLASH OVERLAY</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,sans-serif;
}

/* FULL SCREEN FLASH */

#cutFlash{

    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;

    pointer-events:none;

    z-index:999999;
}

/* ACTIVE */

#cutFlash.active{

    animation:flashAnim .8s ease;
}

/* FLASH ANIMATION */

@keyframes flashAnim{

    0%{
        opacity:0;
        background:rgba(0,0,0,0);
        transform:scale(1);
    }

    10%{
        opacity:1;
        background:rgba(255,255,255,.95);
        transform:scale(1.02);
    }

    25%{
        opacity:1;
        background:rgba(255,0,0,.95);
    }

    40%{
        opacity:1;
        background:rgba(255,255,255,.9);
    }

    60%{
        opacity:1;
        background:rgba(255,0,0,.9);
    }

    100%{
        opacity:0;
        background:rgba(0,0,0,0);
        transform:scale(1);
    }
}

/* TEXT */

.flashText{

    font-size:90px;

    font-weight:900;

    color:white;

    text-transform:uppercase;

    letter-spacing:4px;

    text-shadow:
    0 0 10px red,
    0 0 20px red,
    0 0 40px red,
    0 0 80px red;

    opacity:0;
}

/* TEXT ENTRY */

#cutFlash.active .flashText{

    animation:textAnim .8s ease;
}

@keyframes textAnim{

    0%{
        transform:scale(.3);
        opacity:0;
    }

    20%{
        transform:scale(1.25);
        opacity:1;
    }

    45%{
        transform:scale(1);
        opacity:1;
    }

    100%{
        transform:scale(.8);
        opacity:0;
    }
}

</style>
</head>

<body>

<div id="cutFlash">

    <div class="flashText">
        KABOOTAR CUT GIYA
    </div>

</div>

<script>

/* 🔥 FIREBASE CONFIG */

const firebaseConfig = {

    databaseURL:"https://manpreetpigeons-default-rtdb.firebaseio.com/"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* 🔥 USER ID */

const urlParams = new URLSearchParams(window.location.search);

const userID = urlParams.get('id');

/* 🔥 FLASH FUNCTION */

function runFlash(){

    const flash = document.getElementById('cutFlash');

    // restart animation
    flash.classList.remove('active');

    void flash.offsetWidth;

    flash.classList.add('active');

    // 🔊 SOUND
    const audio = new Audio(
        'https://actions.google.com/sounds/v1/alarms/beep_short.ogg'
    );

    audio.volume = 1;

    audio.play().catch(()=>{});

}

/* 🔥 FIREBASE LISTENER */

db.ref('users/' + userID + '/cutFlash').on('value', function(snapshot){

    const data = snapshot.val();

    if(data){

        runFlash();

    }

});

</script>

</body>
</html>
