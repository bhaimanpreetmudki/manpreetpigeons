<!-- 🔥 FIREBASE CUT FLASH OVERLAY -->

<div id="cutFlashOverlay"></div>

<style>

#cutFlashOverlay{
    position:fixed;
    inset:0;
    z-index:999999;
    pointer-events:none;
    opacity:0;
}

/* 🔥 ACTIVE FLASH */

#cutFlashOverlay.active{
    animation:kabootarCutFlash .8s ease;
}

@keyframes kabootarCutFlash{

    0%{
        opacity:0;
        background:black;
        transform:scale(1);
    }

    10%{
        opacity:1;
        background:white;
        transform:scale(1.03);
    }

    25%{
        opacity:1;
        background:red;
    }

    40%{
        opacity:1;
        background:white;
    }

    60%{
        opacity:.9;
        background:red;
    }

    100%{
        opacity:0;
        background:black;
        transform:scale(1);
    }
}

</style>

<script>

/* 🔥 FLASH FUNCTION */

function triggerCutFlash(){

    const overlay = document.getElementById('cutFlashOverlay');

    overlay.classList.remove('active');

    void overlay.offsetWidth;

    overlay.classList.add('active');

    // 🔊 SOUND
    const audio = new Audio(
        'https://actions.google.com/sounds/v1/alarms/beep_short.ogg'
    );

    audio.volume = 1;

    audio.play().catch(()=>{});

}

/* 🔥 STATUS FUNCTION */

function setStatus(id,s){

    const oldPigeon = localData.pigeons.find(p => p.id == id);

    // update local
    localData.pigeons = localData.pigeons.map(p =>
        p.id == id ? {...p,status:s} : p
    );

    syncPigeons();

    // 🔥 ONLY WHEN CUT
    if(oldPigeon && oldPigeon.status !== 'out' && s === 'out'){

        // firebase trigger
        db.ref('users/' + userID + '/cutFlash').set({

            time:Date.now(),
            pigeon:oldPigeon.name

        });

    }
}

/* 🔥 FIREBASE LISTENER */

db.ref('users/' + userID + '/cutFlash').on('value', snap => {

    const data = snap.val();

    if(!data) return;

    triggerCutFlash();

});

</script>
